name: Bug report
description: Something sheepdog does that it should not, or fails to do.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran and the exact text sheepdog printed.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of `sheepdog doctor --report`
      description: Run it, read it (keys and tokens are redacted, but agent screens can appear in logs), and paste it here.
      render: markdown
    validations:
      required: true
