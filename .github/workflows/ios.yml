name: iOS

# The iPhone app's (ios/) tests on GitHub-hosted Macs: the unit tests
# (SheepdogKitTests) and the UI tests (SheepdogUITests), the UI tests
# against fixture daemons built from this checkout. It builds for the
# simulator only, so it needs no signing certificate, no App Store Connect
# key and no secret of any kind (scripts/workflow-policy.sh checks that).
# Xcode Cloud only archives and uploads TestFlight builds on ios-v* tags; it
# runs no tests (ios/docs/dev/xcode-cloud.md).
#
# plan (Linux) picks the tier and the test jobs, build (one Mac) builds the
# app, its tests and the daemon once, and each test job (one Mac and one
# simulator each) runs its share of the tests from that build. The tiers,
# the job graph and why it looks like this are in docs/dev/development.md
# (CI/CD); the jobs and their tests come from ios/scripts/ci-shards.txt.
# The workflow starts on every PR, so ios-summary always reports and can be
# the one required check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels its older run; every push to main runs to
# the end (a docs merge right after an app merge must not cancel the app
# merge's smoke run).
concurrency:
  group: ios-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.github.kccarlos.herdr-sheepdog-ios
  # The build the test jobs share: one uncompressed upload of a zstd tar
  # (an artifact keeps neither the execute bits nor the symlinks the app
  # and test bundles need).
  BUILD_ARTIFACT: ios-build.tar.zst

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # On a PR the checkout is the merge commit; its first parent is the
      # base branch, so HEAD^1..HEAD is what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: The plan script's tests
        run: bash ios/scripts/ci-plan_test.sh

      # Fails when a UI test class is in no job of ci-shards.txt.
      - name: Every UI test class is in a job
        run: bash ios/scripts/ci-plan.sh check

      - name: Pick the tier
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            workflow_dispatch) tier=full ;;
            pull_request) tier=$(git diff --name-only HEAD^1 HEAD | bash ios/scripts/ci-plan.sh tier) ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
                || ! git fetch -q --depth=1 origin "$BEFORE"; then
                tier=smoke
              else
                tier=$(git diff --name-only "$BEFORE" HEAD | bash ios/scripts/ci-plan.sh tier)
              fi
              # Main gets smoke only: the full suite ran on the PR.
              if [ "$tier" = full ]; then tier=smoke; fi
              ;;
            *) tier=none ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          if [ "$tier" != none ]; then
            echo "matrix=$(bash ios/scripts/ci-plan.sh matrix "$tier")" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::iOS tier: $tier"

  # Builds the app and its test bundles for the simulator (arm64 only, no
  # index store) and the daemon for the fixture daemons, once, and hands
  # them to the test jobs as an artifact kept for a day.
  build:
    needs: plan
    if: needs.plan.outputs.tier != 'none'
    # The xcode-27 image (macOS with Xcode 27.x) has the Xcode the app is
    # developed with; macos-26 stops at Xcode 26.x. Its simulators run iOS
    # 27.0, above the app's iOS 26 deployment target.
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7

      # Build outputs live in the runner's temp directory (the runner
      # context is not available in a job's env).
      - name: Set the paths
        run: |
          {
            echo "DERIVED=$RUNNER_TEMP/DerivedData"
            echo "SPM=$RUNNER_TEMP/spm"
            echo "RESULTS=$RUNNER_TEMP/results"
          } >> "$GITHUB_ENV"

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      # The fixture daemons (ios/scripts/fixture-daemons.sh) are this
      # checkout's daemon, so an API change that breaks the app fails the
      # tests.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the daemon
        run: make build

      # The same pinned XcodeGen as ci_scripts/ci_post_clone.sh (Xcode Cloud).
      - name: Install XcodeGen
        run: |
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the project
        working-directory: ios
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved') }}

      # For any simulator, so no simulator boots here; arm64 only (the
      # hosted Macs are Apple silicon), without the index store nobody reads.
      - name: Build for testing
        working-directory: ios
        run: |
          mkdir -p "$RESULTS"
          status=0
          xcodebuild build-for-testing \
            -project Sheepdog.xcodeproj \
            -scheme Sheepdog \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > "$RESULTS/build.log" 2>&1 || status=$?
          grep -E 'error:|^\*\* ' "$RESULTS/build.log" | tail -n 100 || true
          if [ "$status" -ne 0 ]; then tail -n 80 "$RESULTS/build.log"; fi
          exit "$status"

      # Build/Products holds the .app, the test bundles and the .xctestrun
      # (whose paths are relative to it); bin/sheepdog is the daemon.
      - name: Pack the build
        run: |
          start=$(date +%s)
          tar -cf - -C "$DERIVED/Build" Products -C "$GITHUB_WORKSPACE" bin \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/$BUILD_ARTIFACT"
          ls "$DERIVED"/Build/Products/*.xctestrun
          echo "products $(du -sh "$DERIVED/Build/Products" | cut -f1), packed $(du -h "$RUNNER_TEMP/$BUILD_ARTIFACT" | cut -f1) in $(( $(date +%s) - start )) s" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/${{ env.BUILD_ARTIFACT }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/results
          retention-days: 7

  tests:
    needs: [plan, build]
    name: tests (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      # Smoke and the shards run side by side; the first job that fails
      # cancels the others (a red smoke stops the shards).
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IPHONE_TESTS: ${{ matrix.iphone }}
      IPAD_TESTS: ${{ matrix.ipad }}
      # One simulator per job: an iPad job runs only iPad tests
      # (ci-plan.sh check).
      DEVICE: ${{ matrix.ipad != '' && 'ipad' || 'iphone' }}
    steps:
      - name: Set the paths
        run: |
          {
            echo "BUILD=$RUNNER_TEMP/build"
            echo "RESULTS=$RUNNER_TEMP/results"
            echo "TIMINGS=$RUNNER_TEMP/timings"
          } >> "$GITHUB_ENV"
          echo "job start $(date +%s)" > "$RUNNER_TEMP/timings"

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      # Boots first, so the boot runs while the checkout and the build
      # download do.
      - name: Pick the simulator and start booting it
        id: sim
        run: |
          # The newest iPhone on the image, but not a foldable one (iPhone
          # Duo): unfolded it has regular width, which gets the iPad layout,
          # and the iPhone tests test the iPhone layout. The newest iPad Pro
          # 13" (any iPad if there is none) for IPadUITests.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          devs = json.load(sys.stdin)["devices"]
          def newest(ok):
              best = None
              for runtime, items in devs.items():
                  if "iOS" not in runtime:
                      continue
                  ver = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
                  for d in items:
                      if ok(d["name"]) and (best is None or ver > best[0]):
                          best = (ver, d["udid"], d["name"], runtime)
              return best
          if os.environ["DEVICE"] == "ipad":
              best = newest(lambda n: n.startswith("iPad Pro 13")) or newest(lambda n: n.startswith("iPad"))
          else:
              best = newest(lambda n: n.startswith("iPhone") and "Duo" not in n and "Fold" not in n)
          if best is None:
              sys.exit("no %s simulator available" % os.environ["DEVICE"])
          print(best[2], best[3], file=sys.stderr)
          print(best[1])
          ')
          xcrun simctl boot "$udid" || true
          echo "boot started $(date +%s)" >> "$TIMINGS"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The scripts (fixture daemons, test summary); the build has the rest.
      - uses: actions/checkout@v7

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: |
          mkdir -p "$BUILD" "$RESULTS"
          zstd -dc "$RUNNER_TEMP/$BUILD_ARTIFACT" | tar -xf - -C "$BUILD"
          mv "$BUILD/bin" "$GITHUB_WORKSPACE/bin"
          rm "$RUNNER_TEMP/$BUILD_ARTIFACT"
          xctestrun=$(ls "$BUILD"/Products/*.xctestrun)
          echo "XCTESTRUN=$xctestrun" >> "$GITHUB_ENV"
          echo "build unpacked $(date +%s)" >> "$TIMINGS"

      - name: Wait for the simulator
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          # The app asks for the microphone when the session starts.
          xcrun simctl privacy "${{ steps.sim.outputs.udid }}" grant microphone "$BUNDLE_ID"
          echo "simulator booted $(date +%s)" >> "$TIMINGS"

      # Two free ports for the main (--voice=off) and the pair daemon, and
      # a control directory for scripts/fixture-daemon-restarter.sh. The
      # TEST_RUNNER_ prefix hands them to the UI tests (Fixture.swift). Every
      # job starts them: a test that needs a daemon skips without one.
      - name: Start the fixture daemons
        id: fixture
        run: |
          read -r port pair_port < <(python3 -c '
          import socket
          socks = [socket.socket() for _ in range(2)]
          for s in socks: s.bind(("127.0.0.1", 0))
          print(*[s.getsockname()[1] for s in socks])
          ')
          {
            echo "SHEEPDOG_DAEMON_REPO=$GITHUB_WORKSPACE"
            echo "SHEEPDOG_FIXTURE_PORT=$port"
            echo "SHEEPDOG_FIXTURE_PAIR_PORT=$pair_port"
            echo "SHEEPDOG_FIXTURE_DATA=$RUNNER_TEMP/fixture"
            echo "SHEEPDOG_CONTROL_DIR=$RUNNER_TEMP/fixture-control"
            echo "TEST_RUNNER_SHEEPDOG_FIXTURE_PORT=$port"
            echo "TEST_RUNNER_SHEEPDOG_FIXTURE_PAIR_PORT=$pair_port"
            echo "TEST_RUNNER_SHEEPDOG_LIVE_WS=127.0.0.1:$port"
          } >> "$GITHUB_ENV"
          SHEEPDOG_DAEMON_REPO=$GITHUB_WORKSPACE SHEEPDOG_FIXTURE_PORT=$port \
            SHEEPDOG_FIXTURE_PAIR_PORT=$pair_port SHEEPDOG_FIXTURE_DATA=$RUNNER_TEMP/fixture \
            ios/scripts/fixture-daemons.sh start

      # A hosted Mac is slow enough that a UI tap now and then lands while
      # an animation runs and is lost, a different test each run; a test
      # that fails is run again (up to 3 times) and the job fails only if
      # it never passes. The retries show in the log as repeated
      # "Test Case ... failed" lines above the final pass.

      # The job's unit and UI tests on the iPhone, but the two that need a
      # fresh restart or the restarter (below). The recordings and
      # screenshot tests skip themselves (they need SHEEPDOG_SHOTS and the
      # like).
      - name: Unit and UI tests - iPhone
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && matrix.iphone != '' }}
        working-directory: ios
        run: |
          status=0
          # shellcheck disable=SC2086 # IPHONE_TESTS is a list of arguments
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -collect-test-diagnostics never \
            -retry-tests-on-failure -test-iterations 3 \
            $IPHONE_TESTS \
            -resultBundlePath "$RESULTS/Tests.xcresult" \
            > "$RESULTS/tests.log" 2>&1 || status=$?
          sh scripts/ci-test-summary.sh "$RESULTS/tests.log" "$status"

      # Expects a restart divider in the history, so the main daemon restarts
      # just before it (the other UI tests add conversation after the seeded
      # restart).
      - name: UI test - history and approval
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && matrix.history }}
        working-directory: ios
        run: |
          ./scripts/fixture-daemons.sh restart
          status=0
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -collect-test-diagnostics never \
            -retry-tests-on-failure -test-iterations 3 \
            -only-testing:SheepdogUITests/HistoryApprovalUITests \
            -resultBundlePath "$RESULTS/HistoryApproval.xcresult" \
            > "$RESULTS/history.log" 2>&1 || status=$?
          sh scripts/ci-test-summary.sh "$RESULTS/history.log" "$status"

      # The restarter kills and restarts the main daemon when the test asks.
      - name: UI test - reconnect after a daemon restart
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && matrix.reconnect }}
        working-directory: ios
        run: |
          mkdir -p "$SHEEPDOG_CONTROL_DIR"
          ./scripts/fixture-daemon-restarter.sh > "$RUNNER_TEMP/restarter.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/restarter.pid"
          status=0
          TEST_RUNNER_SHEEPDOG_CONTROL_DIR="$SHEEPDOG_CONTROL_DIR" xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -collect-test-diagnostics never \
            -retry-tests-on-failure -test-iterations 3 \
            -only-testing:SheepdogUITests/ReconnectUITests \
            -resultBundlePath "$RESULTS/Reconnect.xcresult" \
            > "$RESULTS/reconnect.log" 2>&1 || status=$?
          kill "$(cat "$RUNNER_TEMP/restarter.pid")" || true
          sh scripts/ci-test-summary.sh "$RESULTS/reconnect.log" "$status"

      # The iPad layout (IPadUITests, offline demo, no daemon).
      - name: UI tests - iPad
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && matrix.ipad != '' }}
        working-directory: ios
        run: |
          status=0
          # shellcheck disable=SC2086 # IPAD_TESTS is a list of arguments
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -collect-test-diagnostics never \
            -retry-tests-on-failure -test-iterations 3 \
            $IPAD_TESTS \
            -resultBundlePath "$RESULTS/IPad.xcresult" \
            > "$RESULTS/ipad.log" 2>&1 || status=$?
          sh scripts/ci-test-summary.sh "$RESULTS/ipad.log" "$status"

      - name: Stop the fixture daemons
        if: always()
        run: ios/scripts/fixture-daemons.sh stop || true

      # When the simulator was ready and the first test started, in seconds
      # from the job's start (the runner's clock and xcodebuild's are UTC).
      - name: Timings
        if: always()
        run: |
          echo "tests done $(date +%s)" >> "$TIMINGS"
          first=$(grep -h -m1 -oE "Test Suite '(Selected|All) tests' started at [0-9-]+ [0-9:]+" "$RESULTS"/*.log 2>/dev/null \
            | head -n 1 | sed -E 's/.* at //') || true
          if [ -n "$first" ]; then
            echo "first test $(date -j -u -f '%Y-%m-%d %H:%M:%S' "$first" +%s)" >> "$TIMINGS"
          fi
          awk 'NR == 1 { t0 = $NF } { $NF = sprintf("+%ds", $NF - t0); print }' "$TIMINGS" | sort -t+ -k2 -n | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/fixture/**/*.log
            ${{ runner.temp }}/restarter.log
          retention-days: 7

  # The one check to require on main: green when the tier's build and test
  # jobs passed, or when the tier is none and no Mac job ran.
  summary:
    name: ios-summary
    needs: [plan, build, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the plan, the build and the tests
        env:
          PLAN: ${{ needs.plan.result }}
          TIER: ${{ needs.plan.outputs.tier }}
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "plan: $PLAN, tier: $TIER, build: $BUILD, tests: $TESTS"
          if [ "$PLAN" != success ]; then echo "::error::the plan job did not succeed"; exit 1; fi
          case "$TIER" in
            none) want=skipped ;;
            full|smoke) want=success ;;
            *) echo "::error::unknown tier '$TIER'"; exit 1 ;;
          esac
          if [ "$BUILD" != "$want" ] || [ "$TESTS" != "$want" ]; then
            echo "::error::tier $TIER wants the build and the tests $want, got $BUILD and $TESTS"
            exit 1
          fi
