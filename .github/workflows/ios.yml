name: iOS

# Unit tests for the iPhone app (ios/) on a GitHub-hosted Mac. Xcode Cloud
# still archives and uploads the TestFlight builds (ios/docs/dev/xcode-cloud.md);
# this workflow builds for the simulator only, so it needs no signing
# certificate, no App Store Connect key and no secret of any kind.
#
# Not a required check: the required jobs live in ci.yml.

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # The xcode-27 image (macOS with Xcode 27.x, a preview image as of
    # 2026-10) has the Xcode the app is developed with; macos-26 stops at 26.x.
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version

      # The same pinned XcodeGen as ci_scripts/ci_post_clone.sh (Xcode Cloud).
      - name: Install XcodeGen
        run: |
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Pick a simulator
        id: sim
        run: |
          # The newest available iPhone simulator on the image.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devs.items():
              if "iOS" not in runtime:
                  continue
              ver = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
              for d in items:
                  if d["name"].startswith("iPhone") and (best is None or ver > best[0]):
                      best = (ver, d["udid"], d["name"], runtime)
          if best is None:
              sys.exit("no iPhone simulator available")
          print(best[1])
          print(best[2], best[3], file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The unit suite only. The UI tests (SheepdogUITests) need the fixture
      # daemons on 127.0.0.1:7799 and skip themselves without them, so on a
      # hosted runner they would only add a UI-runner build and app launches.
      - name: Unit tests (SheepdogKitTests)
        run: |
          status=0
          xcodebuild test \
            -project Sheepdog.xcodeproj \
            -scheme Sheepdog \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:SheepdogKitTests \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/SheepdogKitTests.xcresult" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
          grep -E '^Test Suite|^Test Case .*(failed|error)|error:|^\*\* |Executed [0-9]+ test' "$RUNNER_TEMP/xcodebuild.log" | tail -n 300 || true
          if [ "$status" -ne 0 ]; then tail -n 80 "$RUNNER_TEMP/xcodebuild.log"; fi
          exit "$status"

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/SheepdogKitTests.xcresult
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
