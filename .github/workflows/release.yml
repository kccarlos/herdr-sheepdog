name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Self-hosted Cloud Run runner by default; CI_RUNNER=ubuntu-latest switches back (infra/ci-runners).
jobs:
  # Ubuntu only: macOS runners bill at 10x. The darwin binary is released
  # unsigned here and signed + notarized afterwards on a Mac with
  # `make release-sign TAG=<tag>` (docs/dev/signing.md).
  release:
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, for scripts/changelog.sh below

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.date=${DATE}'"

          mkdir -p dist release

          declare -A TARGETS=( [darwin]=arm64 [linux]=amd64 )
          for goos in "${!TARGETS[@]}"; do
            goarch="${TARGETS[$goos]}"
            out="dist/sheepdog"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags "$LDFLAGS" -o "$out" ./cmd/sheepdog
            tar -C dist -czf "release/sheepdog_${VERSION}_${goos}_${goarch}.tar.gz" sheepdog
            rm -f "$out"
          done

          (cd release && sha256sum -- *.tar.gz > checksums.txt)

      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          ./scripts/changelog.sh "${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}" > release/notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release/notes.md
          files: |
            release/*.tar.gz
            release/checksums.txt

      - name: Note the unsigned darwin asset
        run: echo "::notice title=darwin binary unsigned::sheepdog_${GITHUB_REF_NAME}_darwin_arm64.tar.gz is unsigned until 'make release-sign TAG=${GITHUB_REF_NAME}' runs on a Mac (docs/dev/signing.md)."
