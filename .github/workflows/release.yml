name: Release

# Tag push: build -> (approve the `release` environment) -> sign and
# notarize the darwin binary and Sheepdog.app -> publish the Homebrew
# formula and cask.
# Dispatch: re-sign and re-publish an existing release without rebuilding it
# (docs/dev/signing.md has the commands).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release to sign and publish to the tap, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Builds both binaries and creates the GitHub Release. Self-hosted Cloud
  # Run runner by default; CI_RUNNER=ubuntu-latest switches back
  # (infra/ci-runners). Tag pushes only: a dispatch must not rebuild and
  # overwrite the signed assets.
  release:
    if: github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, for scripts/changelog.sh below

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.date=${DATE}'"

          mkdir -p dist release

          declare -A TARGETS=( [darwin]=arm64 [linux]=amd64 )
          for goos in "${!TARGETS[@]}"; do
            goarch="${TARGETS[$goos]}"
            out="dist/sheepdog"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags "$LDFLAGS" -o "$out" ./cmd/sheepdog
            tar -C dist -czf "release/sheepdog_${VERSION}_${goos}_${goarch}.tar.gz" sheepdog
            rm -f "$out"
          done

          (cd release && sha256sum -- *.tar.gz > checksums.txt)

      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          ./scripts/changelog.sh "${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}" > release/notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release/notes.md
          files: |
            release/*.tar.gz
            release/checksums.txt

      - name: Note the unsigned darwin asset
        run: echo "::notice title=darwin binary unsigned::sheepdog_${GITHUB_REF_NAME}_darwin_arm64.tar.gz stays unsigned until the sign-macos job runs, after the release environment is approved (docs/dev/signing.md)."

  # Signs and notarizes the darwin binary with scripts/release-sign.sh (the
  # same script as `make release-sign`), replacing the tarball and
  # checksums.txt on the release, then builds, signs, notarizes and staples
  # Sheepdog.app with scripts/release-sign-app.sh and adds its zip to the
  # release and checksums.txt. App failures are recorded in app_signed, not
  # allowed to fail the daemon release. The only job outside ios.yml that may
  # use a GitHub-hosted Mac, and only because it runs in the `release`
  # environment (maintainer approval, v* tags only); the policy check enforces
  # that.
  sign-macos:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (needs.release.result == 'skipped' && github.event_name == 'workflow_dispatch')) }}
    # The runner ios.yml uses: it has Xcode 27, which SheepdogMac needs (the
    # macos-15 image's newest Xcode, 26.3, cannot build it).
    runs-on: xcode-27
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      app_signed: ${{ steps.app_status.outputs.signed || 'false' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPO: ${{ github.repository }}
      NOTARY_ISSUER_ID: 686fbf99-b25d-4e9c-af7c-2b7cb2c3f1eb
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      # Signing material is in 1Password (vault github); this is the token.
      - name: Signing credentials present?
        id: creds
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9] ]] || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
          missing=""
          [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ] || missing="$missing OP_SERVICE_ACCOUNT_TOKEN"
          if [ -n "$missing" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=darwin binary not signed::the release environment lacks${missing}: skipping signing and the Homebrew formula (docs/dev/signing.md)"
            exit 0
          fi
          gh release view "$TAG" -R "$RELEASE_REPO" --json tagName -q .tagName > /dev/null \
            || { echo "::error::no GitHub Release for $TAG"; exit 1; }
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v7

      - name: Install the 1Password CLI
        if: steps.creds.outputs.ok == 'true'
        uses: 1password/install-cli-action@v4

      # Signing secrets from 1Password, each read retried (scripts/op-load.sh);
      # step outputs, so only the steps that name them see the values.
      - name: Secrets from 1Password
        id: op
        if: steps.creds.outputs.ok == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: >-
          scripts/op-load.sh
          MACOS_CERT_P12_BASE64=op://github/apple-developer-id-application/p12_base64
          MACOS_CERT_PASSWORD=op://github/apple-developer-id-application/password
          NOTARY_API_KEY_P8=op://github/app-store-connect-api-key/p8_base64
          NOTARY_KEY_ID=op://github/app-store-connect-api-key/key_id

      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.creds.outputs.ok == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ steps.op.outputs.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ steps.op.outputs.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          kc="$RUNNER_TEMP/sheepdog-sign.keychain-db"
          p12="$RUNNER_TEMP/sheepdog-sign.p12"
          kc_pw="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          # The Developer ID G2 intermediate, in case the .p12 lacks the chain
          # (a public Apple CA certificate).
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
          # Put it in the search list so codesign can build the chain.
          existing="$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$kc" $existing
          if ! security find-identity -v -p codesigning "$kc" | grep -q '"Developer ID Application: .*(GV776BZVA8)"'; then
            security find-identity -p codesigning "$kc" || true
            echo "::error::no valid Developer ID Application identity for team GV776BZVA8 in 1Password item apple-developer-id-application"
            exit 1
          fi
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        if: steps.creds.outputs.ok == 'true'
        env:
          NOTARY_API_KEY_P8: ${{ steps.op.outputs.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          key="$RUNNER_TEMP/notary/AuthKey.p8"
          # The secret is the .p8 file's text; a base64 of it works too.
          if printf '%s' "$NOTARY_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$NOTARY_API_KEY_P8" > "$key"
          else
            printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo "::error::NOTARY_API_KEY_P8 is not a .p8 private key"; exit 1; }
          echo "NOTARY_KEY=$key" >> "$GITHUB_ENV"

      - name: Sign, notarize and upload (scripts/release-sign.sh)
        id: sign
        if: steps.creds.outputs.ok == 'true'
        env:
          NOTARY_ISSUER: ${{ env.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ steps.op.outputs.NOTARY_KEY_ID }}
          SIGN_IDENTITY_MATCH: "Developer ID Application"
        run: |
          set -euo pipefail
          ./scripts/release-sign.sh "$TAG"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the published darwin tarball
        if: steps.sign.outputs.signed == 'true'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/verify"
          rm -rf "$d"; mkdir -p "$d/bin"
          asset="sheepdog_${TAG}_darwin_arm64.tar.gz"
          gh release download "$TAG" -R "$RELEASE_REPO" -D "$d" -p "$asset" -p checksums.txt
          (cd "$d" && shasum -a 256 -c checksums.txt --ignore-missing)
          grep -q "_linux_amd64.tar.gz" "$d/checksums.txt" || { echo "::error::checksums.txt lost the linux line"; exit 1; }
          tar -xzf "$d/$asset" -C "$d/bin"
          codesign --verify --strict --verbose=2 "$d/bin/sheepdog"
          codesign --display --verbose=2 "$d/bin/sheepdog" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)'
          codesign --display --verbose=2 "$d/bin/sheepdog" 2>&1 | grep -q '^TeamIdentifier=GV776BZVA8$'
          # Bare Mach-O: `spctl -t install` is for .pkg and `-t execute` rejects
          # every CLI binary; this context reports the notarization.
          spctl --assess --type open --context context:primary-signature -vv "$d/bin/sheepdog" 2>&1 | tee "$d/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$d/spctl.txt"
          echo "::notice title=darwin binary signed::$asset is signed and notarized"

      # Sheepdog.app, after the daemon: the same keychain and API key
      # (docs/dev/signing.md, "Sheepdog.app"). The Xcode and XcodeGen are
      # the ones ios.yml pins, so the app is archived with the toolchain its
      # tests ran on.
      - name: Select Xcode 27.1
        id: xcode
        if: steps.sign.outputs.signed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Install XcodeGen
        id: xcodegen
        if: steps.sign.outputs.signed == 'true' && steps.xcode.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Build, sign, notarize and upload Sheepdog.app (scripts/release-sign-app.sh)
        id: app
        if: steps.sign.outputs.signed == 'true' && steps.xcodegen.outcome == 'success'
        continue-on-error: true
        env:
          NOTARY_ISSUER: ${{ env.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ steps.op.outputs.NOTARY_KEY_ID }}
          SIGN_IDENTITY_MATCH: "Developer ID Application"
        run: |
          set -euo pipefail
          ./scripts/release-sign-app.sh "$TAG"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the published Sheepdog.app
        id: verify-app
        if: steps.app.outputs.signed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/verify-app"
          rm -rf "$d"; mkdir -p "$d/app"
          version="${TAG#v}"; version="${version%%-*}"
          asset="Sheepdog-${version}-macos.zip"
          gh release download "$TAG" -R "$RELEASE_REPO" -D "$d" -p "$asset" -p checksums.txt
          (cd "$d" && shasum -a 256 -c checksums.txt --ignore-missing)
          grep -q "_linux_amd64.tar.gz" "$d/checksums.txt" || { echo "::error::checksums.txt lost the linux line"; exit 1; }
          grep -q "_darwin_arm64.tar.gz" "$d/checksums.txt" || { echo "::error::checksums.txt lost the darwin line"; exit 1; }
          ditto -x -k "$d/$asset" "$d/app"
          app="$d/app/Sheepdog.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -q '^TeamIdentifier=GV776BZVA8$'
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee "$d/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$d/spctl.txt"
          echo "::notice title=Sheepdog.app signed::$asset is signed, notarized and stapled"

      - name: Record whether Sheepdog.app shipped
        id: app_status
        if: steps.sign.outputs.signed == 'true'
        env:
          APP_SIGNED: ${{ steps.app.outputs.signed }}
          VERIFY: ${{ steps.verify-app.outcome }}
        run: |
          set -euo pipefail
          if [[ "$APP_SIGNED" == true && "$VERIFY" == success ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            message="Sheepdog.app was not shipped; the daemon release continues"
            echo "::warning title=Sheepdog.app not shipped::$message"
            {
              echo "## Sheepdog.app not shipped"
              echo
              echo "$message."
              echo "Investigate the app steps in this job; the release binary and Homebrew formula are unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the keychain and the API key
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/sheepdog-sign.p12" "$RUNNER_TEMP/sheepdog-sign.keychain-db"

  # Renders Formula/sheepdog.rb (the daemon) from the signed checksums and
  # updates kccarlos/homebrew-tap. It adds Casks/sheepdog-app.rb only when
  # Sheepdog.app was signed and verified. GitHub-hosted ubuntu-latest
  # (Homebrew and Ruby preinstalled, a fresh VM per run) rather than the Cloud
  # Run runner; Homebrew casks need macOS, so the cask is only syntax-checked
  # here.
  homebrew:
    needs: sign-macos
    if: ${{ !cancelled() && needs.sign-macos.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      APP_SIGNED: ${{ needs.sign-macos.outputs.app_signed }}
    steps:
      - name: Tap token present?
        id: creds
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Homebrew formula not published::the release environment lacks OP_SERVICE_ACCOUNT_TOKEN: skipping the tap update (docs/dev/signing.md)"
          fi

      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v7

      - name: Install the 1Password CLI
        if: steps.creds.outputs.ok == 'true'
        uses: 1password/install-cli-action@v4

      # The tap token from 1Password (homebrew-tap-token), retried (scripts/op-load.sh).
      - name: Secrets from 1Password
        id: op
        if: steps.creds.outputs.ok == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: scripts/op-load.sh HOMEBREW_TAP_TOKEN=op://github/homebrew-tap-token/credential

      - name: Render the formula from the signed checksums
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -euo pipefail
          packaging/homebrew/render.sh "$TAG" > "$RUNNER_TEMP/sheepdog.rb"
          ruby -c "$RUNNER_TEMP/sheepdog.rb"
          cat "$RUNNER_TEMP/sheepdog.rb"

      - name: Render the cask from the signed checksums
        id: cask
        if: steps.creds.outputs.ok == 'true' && env.APP_SIGNED == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          packaging/homebrew/render.sh --cask "$TAG" > "$RUNNER_TEMP/sheepdog-app.rb"
          ruby -c "$RUNNER_TEMP/sheepdog-app.rb"
          cat "$RUNNER_TEMP/sheepdog-app.rb"
          echo "rendered=true" >> "$GITHUB_OUTPUT"

      - name: brew audit --strict
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          t="$(brew --repository)/Library/Taps/sheepdog-ci/homebrew-audit"
          mkdir -p "$t/Formula"
          cp "$RUNNER_TEMP/sheepdog.rb" "$t/Formula/sheepdog.rb"
          git -C "$t" init -q
          brew audit --strict --formula sheepdog-ci/audit/sheepdog
          rm -rf "$t"

      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: kccarlos/homebrew-tap
          ref: main
          token: ${{ steps.op.outputs.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Record what the tap update includes
        if: steps.creds.outputs.ok == 'true'
        env:
          CASK: ${{ steps.cask.outputs.rendered }}
        run: |
          set -euo pipefail
          if [[ "$APP_SIGNED" == true && "$CASK" == true ]]; then
            message="Sheepdog.app was signed and its cask is included"
          elif [[ "$APP_SIGNED" == true ]]; then
            message="Sheepdog.app was signed but its cask could not be rendered; the daemon formula continues"
            echo "::warning title=Sheepdog.app cask not published::$message"
          else
            message="Sheepdog.app was not shipped; the daemon formula continues"
            echo "::warning title=Sheepdog.app not published::$message"
          fi
          {
            echo "## Homebrew tap"
            echo
            echo "$message."
            echo "The daemon formula is rendered and updated whenever its signing succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the Homebrew tap files
        id: tap
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -euo pipefail
          cask=()
          if [[ "${{ steps.cask.outputs.rendered }}" == true ]]; then
            cask=("$RUNNER_TEMP/sheepdog-app.rb")
          fi
          packaging/homebrew/tap-update.sh homebrew-tap "$RUNNER_TEMP/sheepdog.rb" ${cask[@]+"${cask[@]}"} "$TAG" | tee "$RUNNER_TEMP/tap-update.txt"
          if grep -q '^changed=true$' "$RUNNER_TEMP/tap-update.txt"; then
            git -C homebrew-tap push origin HEAD:main
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Install from the tap (Linux smoke test)
        if: steps.tap.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap kccarlos/tap
          brew install --formula kccarlos/tap/sheepdog
          sheepdog version
          brew test kccarlos/tap/sheepdog
