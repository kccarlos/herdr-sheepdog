name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on self-hosted runners on Cloud Run worker pools (infra/ci-runners).
# Switch back to GitHub-hosted: gh variable set CI_RUNNER --body ubuntu-latest
jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  eval:
    # Offline brain eval: fake model, no network, no API keys (make eval).
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make eval

  policy:
    # Xcode/iOS work runs only on Xcode Cloud; macOS runners are too expensive.
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
      - name: No macOS runners or Xcode builds in workflows
        run: |
          # bracketed characters keep this step from matching itself
          if grep -rnEi --include='*.yml' --include='*.yaml' 'macos[-]|xcodebuil[d]' .github/workflows; then
            echo "::error::macOS runners and Xcode builds are not allowed in GitHub Actions (see README, CI/CD)"
            exit 1
          fi

  web:
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'web/voice/*.test.mjs' 'web/debug/*.test.mjs'

  cross:
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o dist/sheepdog-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sheepdog
