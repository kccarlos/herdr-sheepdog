name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's files through the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on self-hosted runners on Cloud Run worker pools (infra/ci-runners).
# Switch back to GitHub-hosted: gh variable set CI_RUNNER --body ubuntu-latest
#
# ios/ is the iPhone app (ios.yml runs its unit and UI tests on a hosted
# Mac; Xcode Cloud only archives TestFlight builds). The required jobs
# below must report a result on every PR, so they always start, and their
# steps run only when something outside ios/ changed (changes.outputs.code).
# Do not use workflow-level paths-ignore: it leaves required checks pending.
jobs:
  changes:
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!ios/**'
      - if: steps.filter.outputs.code != 'true'
        run: echo "::notice::Only ios/ changed; the Go, web and eval jobs pass without running their heavy steps (ios.yml tests the app)."

  test:
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      # Checkout, Go and the docs check run for every change, ios/ included
      # (ios/**/*.md links and ios/README.md's sheepdog commands are checked).
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: needs.changes.outputs.code == 'true'
        run: go vet ./...
      - if: needs.changes.outputs.code == 'true'
        run: go test -race ./...
      # The plugin's install script: download, checksum, go fallback, the
      # ~/.local/bin link (into a temp dir) and the next-step line.
      - if: needs.changes.outputs.code == 'true'
        run: sh scripts/plugin-fetch_test.sh
      # The Homebrew formula render and the tap commit (scratch repo, no push).
      - if: needs.changes.outputs.code == 'true'
        run: bash packaging/homebrew/tap-update_test.sh
      # Docs: every relative link in the Markdown files resolves, and every
      # `sheepdog ...` command in the user docs exists in --help. Offline.
      # (Also part of go test above; kept as its own step so a docs failure
      # is named in the checks list.)
      - run: go test -run 'TestMarkdownLinks|TestDocCommandsExist|TestCommandExtraction' ./internal/docscheck

  lint:
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: needs.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  eval:
    needs: changes
    # Offline brain eval: fake model, no network, no API keys (make eval).
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: needs.changes.outputs.code == 'true'
        run: make eval

  policy:
    # Where macOS runners, Xcode and secrets may appear (scripts/workflow-policy.sh):
    # ios.yml (simulator unit and UI tests, no secrets at all), and release.yml's
    # jobs that declare `environment: release` (signing; maintainer approval).
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - uses: actions/checkout@v7
      - name: The policy script's tests
        run: bash scripts/workflow-policy_test.sh
      - name: macOS and secrets only where the policy allows
        run: bash scripts/workflow-policy.sh

  web:
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - if: needs.changes.outputs.code == 'true'
        run: node --test 'web/voice/*.test.mjs' 'web/debug/*.test.mjs' 'web/static/*.test.mjs' 'web/setup/*.test.mjs' 'herdr-app/mods/sheepdog/*/*.test.mjs'

  cross:
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'cloudrun' }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: needs.changes.outputs.code == 'true'
        name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o dist/sheepdog-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sheepdog
