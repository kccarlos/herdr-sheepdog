name: Sheepdog
options:
  bundleIdPrefix: com.kccarlos.sheepdog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode on purpose: the audio path (AVAudioEngine tap
    # callbacks, AVAudioConverter input blocks) is not Sendable-clean under
    # Swift 6 strict concurrency and fighting it buys nothing for v1.
    # The view models are @MainActor and the Kit types are value types.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SheepdogKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SheepdogKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kccarlos.sheepdog.kit
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  Sheepdog:
    type: application
    platform: iOS
    sources:
      - path: Sources/Sheepdog
    dependencies:
      - target: SheepdogKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kccarlos.sheepdog.app
        PRODUCT_NAME: Sheepdog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Sources/Sheepdog/Info.plist
      properties:
        CFBundleDisplayName: Sheepdog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          Sheepdog uses the microphone so you can talk to your flock of coding
          agents. Audio goes only to the sheepdog daemon you point the app at.
        NSLocalNetworkUsageDescription: >-
          Sheepdog talks to the sheepdog daemon running on your Mac, over your
          local network or Tailscale.
        # The daemon speaks plain HTTP on a private network by design
        # (docs/ws-contract.md "Non-goals": no TLS in v1), so arbitrary loads
        # have to be allowed. Only this key: ATS ignores
        # NSAllowsArbitraryLoads whenever NSAllowsLocalNetworking (or the
        # media/web-content variants) is also present, and local networking
        # does not cover a Tailscale 100.64/10 address — with both keys the
        # app got NSURLErrorAppTransportSecurityRequiresSecureConnection
        # against the Mac's Tailscale IP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  SheepdogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SheepdogUITests
    dependencies:
      - target: Sheepdog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kccarlos.sheepdog.uitests
        GENERATE_INFOPLIST_FILE: YES

  SheepdogKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SheepdogKitTests
    # Hosted in the app so the keychain test runs with the app's entitlements
    # (a hostless XCTest bundle has no keychain access group and every
    # SecItemAdd fails with errSecMissingEntitlement).
    dependencies:
      - target: SheepdogKit
      - target: Sheepdog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kccarlos.sheepdog.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sheepdog:
    build:
      targets:
        Sheepdog: all
        SheepdogKit: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SheepdogKitTests

  # The end-to-end walkthrough: it needs a daemon on 127.0.0.1:7799, so it
  # stays out of the Sheepdog scheme (and out of CI).
  SheepdogUITests:
    build:
      targets:
        Sheepdog: all
        SheepdogUITests: [test]
    test:
      config: Debug
      targets:
        - SheepdogUITests
