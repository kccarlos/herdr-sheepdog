name: Sheepdog
options:
  bundleIdPrefix: com.github.kccarlos.herdr-sheepdog-ios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # The generated project is not committed, so neither is the Package.resolved
  # Xcode keeps inside it; the committed copy next to this file goes in after
  # every generate (Xcode Cloud, ios.yml and local builds alike).
  postGenCommand: scripts/install-package-resolved.sh

# Swift packages. Each one is pinned to an exact version, and
# Package.resolved (next to this file) pins its dependencies too: XcodeGen's
# postGenCommand above copies it into the generated project, because Xcode
# Cloud refuses to resolve packages without one. To update a pin, see
# docs/dev/architecture.md "The terminal surface".
packages:
  # The terminal renderer behind TerminalSurface (SheepdogKit), MIT.
  # docs/dev/design/phone-terminal.md section 2.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.0

settings:
  base:
    # Swift 5 language mode on purpose: the audio path (AVAudioEngine tap
    # callbacks, AVAudioConverter input blocks) is not Sendable-clean under
    # Swift 6 strict concurrency and fighting it buys nothing for v1.
    # The view models are @MainActor and the Kit types are value types.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # The version TestFlight shows. Bump it before tagging a release; the
    # tag must match (v0.1.0 for 0.1.0) — ci_scripts/ci_post_clone.sh
    # fails a tag build otherwise. The build number is not kept here:
    # Xcode Cloud gives every build its own (CI_BUILD_NUMBER) and uses it
    # for the uploaded build, so CURRENT_PROJECT_VERSION stays 1 for local
    # builds. docs/dev/xcode-cloud.md.
    MARKETING_VERSION: "0.1.14"
    CURRENT_PROJECT_VERSION: "1"
    # The paid team. Automatic signing locally; Xcode Cloud
    # signs with its own cloud-managed certificates for this team.
    DEVELOPMENT_TEAM: GV776BZVA8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # The App Group the app and its Notification Service Extension share:
    # its keychain access group holds the push content key the extension
    # decrypts relay notifications with (Sources/SheepdogPush). A self-built
    # app under another team needs its own group id here.
    SHEEPDOG_APP_GROUP: group.com.github.kccarlos.herdr-sheepdog-ios

targets:
  SheepdogKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SheepdogKit
      - path: Sources/SheepdogPush
    dependencies:
      # Only SwiftTermSurface.swift imports it; the rest of the app talks to
      # the TerminalSurface protocol.
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.kccarlos.herdr-sheepdog-ios.kit
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  Sheepdog:
    type: application
    platform: iOS
    sources:
      - path: Sources/Sheepdog
      # The Live Activity's attributes and the App Intents, shared with
      # SheepdogWidgets (the widget renders, the app runs the intents).
      - path: Sources/SheepdogActivity
      # The widget's views, for the DEBUG Live Activity gallery
      # (LiveActivityGallery.swift); the @main bundle stays extension-only.
      - path: Sources/SheepdogWidgets/VoiceSessionLiveActivity.swift
    dependencies:
      - target: SheepdogKit
      # Embedded in PlugIns/: the Live Activity, Dynamic Island and the
      # "Talk to Sheepdog" control.
      - target: SheepdogWidgets
      - target: SheepdogNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.kccarlos.herdr-sheepdog-ios
        PRODUCT_NAME: Sheepdog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      # Phone notifications (APNs). The entitlement's aps-environment and
      # the environment the app tells the daemon its token belongs to are
      # one decision, made per configuration: Debug (Xcode runs,
      # development-signed) talks to the APNs sandbox, Release (what Xcode
      # Cloud archives for TestFlight and the App Store) to production.
      configs:
        Debug:
          APS_ENVIRONMENT: development
          SHEEPDOG_PUSH_ENVIRONMENT: sandbox
        Release:
          APS_ENVIRONMENT: production
          SHEEPDOG_PUSH_ENVIRONMENT: production
    entitlements:
      path: Sources/Sheepdog/Sheepdog.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        # Lets "needs you" alerts (interruption-level time-sensitive) break
        # through Focus; without it iOS delivers them as active.
        com.apple.developer.usernotifications.time-sensitive: true
        # Shared with the Notification Service Extension: the push content
        # key lives in this group's keychain access group.
        com.apple.security.application-groups:
          - $(SHEEPDOG_APP_GROUP)
    info:
      path: Sources/Sheepdog/Info.plist
      properties:
        CFBundleDisplayName: Sheepdog
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Brand launch screen: #1B1D22 with the cream mono logo at 80 pt.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIBackgroundModes:
          - audio
        # The voice session's Live Activity (SheepdogWidgets). Started and
        # updated locally; no push updates, so no push-type entitlement.
        NSSupportsLiveActivities: true
        # sheepdog://talk starts the voice session, sheepdog://agent/<pane id>
        # opens that agent (SheepdogKit AppRoute).
        CFBundleURLTypes:
          - CFBundleURLName: com.github.kccarlos.herdr-sheepdog-ios
            CFBundleURLSchemes:
              - sheepdog
        NSMicrophoneUsageDescription: >-
          Sheepdog uses the microphone so you can talk to your coding agents.
          Your voice goes only to the sheepdog daemon on your own computer; in
          the demo it stays on this iPhone.
        NSSpeechRecognitionUsageDescription: >-
          In the demo, Sheepdog recognises your spoken questions on this
          iPhone only (on-device recognition). Nothing is sent anywhere.
        NSCameraUsageDescription: >-
          Sheepdog uses the camera to scan the pairing code that
          "sheepdog setup" or "sheepdog pair" shows on your computer, and to
          take a photo you attach for an agent, which goes only to your own
          computer. Nothing is recorded in the background.
        NSLocalNetworkUsageDescription: >-
          Sheepdog connects to the sheepdog daemon on your own computer, over
          your local network.
        # The daemon speaks plain HTTP on a private network by design
        # (docs/ws-contract.md "Non-goals": no TLS in v1), so arbitrary loads
        # have to be allowed. Only this key: ATS ignores
        # NSAllowsArbitraryLoads whenever NSAllowsLocalNetworking (or the
        # media/web-content variants) is also present, and local networking
        # does not cover a Tailscale 100.64/10 address — with both keys the
        # app got NSURLErrorAppTransportSecurityRequiresSecureConnection
        # against the Mac's Tailscale IP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Export compliance: the app implements no encryption of its own; it
        # uses only what iOS provides (URLSession, URLSessionWebSocketTask;
        # HTTPS/WSS when the daemon offers it; CryptoKit's AES-GCM to open
        # end-to-end encrypted notifications), which is exempt. Saying so here
        # answers App Store Connect's encryption question for every upload,
        # so TestFlight builds do not wait on "Missing Compliance".
        # docs/dev/xcode-cloud.md.
        ITSAppUsesNonExemptEncryption: false
        # sandbox or production, from the configuration (above); read by
        # PushCoordinator when it registers the device token with the daemon.
        SheepdogPushEnvironment: $(SHEEPDOG_PUSH_ENVIRONMENT)
        # The keychain access group of the push content key (PushContentKeyStore).
        SheepdogAppGroup: $(SHEEPDOG_APP_GROUP)

  # The widget extension: the voice session's Live Activity (lock screen
  # and Dynamic Island) and, on iOS 18+, the "Talk to Sheepdog" control.
  # It renders only; its buttons are App Intents the system runs in the
  # app's process. No App Group: nothing is shared through a container
  # (ActivityKit carries the content state). Its bundle ID is registered on
  # team GV776BZVA8 with no capabilities (docs/dev/xcode-cloud.md).
  SheepdogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/SheepdogWidgets
      - path: Sources/SheepdogActivity
    info:
      path: Sources/SheepdogWidgets/Info.plist
      properties:
        # An extension's versions must match the app's or App Store
        # validation rejects the upload; XcodeGen would write 1.0/1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required on every embedded appex (validation error 90360).
        CFBundleDisplayName: Sheepdog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.kccarlos.herdr-sheepdog-ios.widgets
        PRODUCT_NAME: SheepdogWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Decrypts end-to-end encrypted relay notifications (the daemon's
  # docs/dev/push.md "End-to-end encryption") with the content key the app
  # stored in the App Group keychain, and passes direct-APNs notifications
  # through. Kept small: CryptoKit, Security and UserNotifications only, no
  # SheepdogKit, no networking.
  SheepdogNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/SheepdogNotificationService
      - path: Sources/SheepdogPush
    entitlements:
      path: Sources/SheepdogNotificationService/SheepdogNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SHEEPDOG_APP_GROUP)
    info:
      path: Sources/SheepdogNotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Sheepdog
        SheepdogAppGroup: $(SHEEPDOG_APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.kccarlos.herdr-sheepdog-ios.NotificationService
        PRODUCT_NAME: SheepdogNotificationService
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  SheepdogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SheepdogUITests
    dependencies:
      - target: Sheepdog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.kccarlos.herdr-sheepdog-ios.uitests
        GENERATE_INFOPLIST_FILE: YES

  SheepdogKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SheepdogKitTests
    # Hosted in the app so the keychain test runs with the app's entitlements
    # (a hostless XCTest bundle has no keychain access group and every
    # SecItemAdd fails with errSecMissingEntitlement).
    dependencies:
      - target: SheepdogKit
      - target: Sheepdog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.kccarlos.herdr-sheepdog-ios.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Shared (XcodeGen writes schemes to xcshareddata), which Xcode Cloud
  # needs: its TestFlight workflow archives this scheme.
  #
  # Test runs the unit suite and the UI tests. The UI tests that need a
  # fixture daemon skip themselves when none answers on 127.0.0.1:7799;
  # .github/workflows/ios.yml starts the fixture daemons and runs them all
  # (docs/dev/status.md). Xcode Cloud only archives this scheme.
  Sheepdog:
    build:
      targets:
        Sheepdog: all
        SheepdogKit: all
        SheepdogWidgets: all
        SheepdogNotificationService: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SheepdogKitTests
        - SheepdogUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Only the UI tests, for iterating on them against the fixture daemons.
  SheepdogUITests:
    build:
      targets:
        Sheepdog: all
        SheepdogUITests: [test]
    test:
      config: Debug
      targets:
        - SheepdogUITests
