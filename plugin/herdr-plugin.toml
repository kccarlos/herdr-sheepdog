id = "sheepdog.herdr-shim"
name = "sheepdog"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Forwards agent state events to the sheepdog daemon over HTTP"
platforms = ["macos", "linux"]

# Fleet-wide (every pane, not just one the socket subscription is bound
# to — see docs/herdr-protocol.md §8): the daemon already handles
# POST /api/herdr/event with exactly this payload shape
# (HERDR_PLUGIN_EVENT_JSON), so every hook below just forwards it.

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "hooks/forward-event.sh"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "hooks/forward-event.sh"]

[[events]]
on = "pane.closed"
command = ["sh", "hooks/forward-event.sh"]

[[events]]
on = "pane.exited"
command = ["sh", "hooks/forward-event.sh"]
