<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — iPad, a busy hour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1376px; height: 1032px; display: flex; overflow: hidden; background: {{ c.surface }}; color: {{ c.ink }}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="IPadSidebar" sel="conversation" dark="{{ dark }}" style="display: block; width: 390px; height: 1032px; flex-shrink: 0" hint-size="390px,1032px"></dc-import>

  <section aria-label="Conversation" style="position: relative; width: 986px; height: 1032px; display: flex; flex-direction: column">
    <div style="height: 24px; flex-shrink: 0"></div>
    <header style="height: 52px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; padding: 0 10px; border-bottom: 1px solid {{ c.line }}">
      <span></span>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 17px; font-weight: 600">Conversation</span>
        <span style="font-size: 12px; color: {{ c.muted }}">Talking to Work Mac</span>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 2px">
        <button aria-label="New conversation" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: {{ c.ink }}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg></button>
        <button aria-label="More" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: {{ c.ink }}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="18.5" cy="12" r="1.7"></circle></svg></button>
      </div>
    </header>

    <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 16px 24px 12px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="14">
        <div style="margin-top: {{ r.gap }}px; width: 680px">
          <dc-import name="ChatRow" kind="{{ r.kind }}" pos="{{ r.pos }}" text="{{ r.text }}" time="{{ r.time }}" gutter="" dark="{{ dark }}" w="{{ 680 }}" style="display: block; width: 680px" hint-size="680px,48px"></dc-import>
        </div>
      </sc-for>
    </main>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 24px 26px">
      <section aria-label="Codex needs your answer" style="width: 680px; box-sizing: border-box; padding: 14px 16px; border-radius: 18px; background: {{ c.card }}; border: 1.5px solid {{ c.blocked }}; box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 14px">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{ c.muted }}"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{ c.blocked }}"></span><span style="font-weight: 600; color: {{ c.ink }}">Codex</span> · 1 min</span>
          <span style="font-size: 17px; font-weight: 600">Codex is asking allow Computer Use to use Finder.</span>
        </div>
        <button style="min-height: 44px; padding: 6px 22px; border-radius: 22px; border: 0; background: {{ c.accent }}; color: #1F1F22; font-size: 15px; font-weight: 600">Yes, proceed</button>
        <button style="min-height: 44px; padding: 6px 22px; border-radius: 22px; border: 1px solid {{ c.line }}; background: {{ c.card }}; color: {{ c.ink }}; font-size: 15px">No</button>
      </section>
      <div style="height: 60px; display: flex; justify-content: center">
        <dc-import name="Dock" label="Work Mac" status="Listening" mode="quiet" dark="{{ dark }}" style="display: block; width: 366px; height: 60px" hint-size="366px,60px"></dc-import>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1376,"height":1032}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const c = dark
      ? { surface: '#16181C', card: '#1F2126', ink: '#F5F2EA', muted: '#A3A7AF', line: '#2E3138', accent: '#F39C1F', blocked: '#F0A92A' }
      : { surface: '#FAF8F3', card: '#FFFFFF', ink: '#1F1F22', muted: '#6B6E75', line: '#E4E0D7', accent: '#D98718', blocked: '#D99417' };
    const R = (kind, gap, o) => Object.assign({ kind, gap, pos: 'single', text: '', time: '' }, o || {});
    const rows = [
      R('earlier', 0),
      R('day', 2),
      R('groupOpen', 8, { pos: 'first' }),
      R('missed', 0, { pos: 'mid', text: 'Both releases are underway. The daemon fix is waiting on CI.', time: '12:09' }),
      R('missed', 0, { pos: 'last', text: 'Claude finished the forumind work and has published it.', time: '12:31' }),
      R('restarted', 8),
      R('missed', 8, { text: 'The local daemon is now the signed v0.1.9.', time: '12:53' }),
      R('talkingTo', 18),
      R('you', 14),
      R('voiceDetailsOpen', 6),
      R('youTyped', 18),
      R('voice', 6, { text: 'Codex wants to use Finder. Its question is below.' }),
      R('pointer', 4),
      R('approved', 18, { pos: 'first', time: '13:03' }),
      R('closed', 0, { pos: 'mid', time: '13:03' }),
      R('update', 0, { pos: 'last', time: '13:04' }),
      R('card', 8)
    ];
    return { c, dark, rows };
  }
}
</script>
</body>
</html>
