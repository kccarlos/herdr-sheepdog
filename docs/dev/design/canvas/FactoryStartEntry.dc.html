  <div style="padding: 0 20px 10px; display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.3px">blog-engine</h1>
    <span style="font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #6B6E75">~/code/blog-engine · main</span>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 4px 16px">

      </div>

    <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; padding: 14px; font-size: 15px; color: #6B6E75">No other worktrees.</div>

        <span style="font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #6B6E75">npm test</span>
      </button>
      <button style="border: 0; background: transparent; color: #8A5700; text-align: left; padding: 0 14px; min-height: 52px; display: flex; align-items: center; gap: 12px; font-size: 16px">

    <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; display: flex; flex-direction: column">
      <button style="border: 0; background: transparent; color: #8A5700; text-align: left; padding: 0 14px; min-height: 52px; display: flex; align-items: center; gap: 12px; font-size: 16px">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10l5 3V10l5 3V5h4l1 15zM3 20h18"></path></svg>
        Start a factory here…

    <span style="font-size: 12px; line-height: 17px; color: #6B6E75; padding: 0 4px">Opens a shell in this folder and runs sheepdog factory start. It checks this computer, asks a few questions, then builds your goal and only speaks when it needs you.</span>

    <button style="margin-top: 8px; height: 50px; border-radius: 14px; border: 1px solid #E4E0D7; background: #FFFFFF; color: #B42318; font-size: 16px; font-weight: 500">Close space</button>
  </main>
</div>
