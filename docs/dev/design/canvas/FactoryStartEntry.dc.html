<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — a space with no factory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: {{ top }}px; flex-shrink: 0"></div>
  <header style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <button aria-label="Back to Spaces" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <button style="height: 44px; border: 0; background: transparent; color: {{c.accentText}}; font-size: 16px; padding: 0 10px">Rename</button>
  </header>
  <div style="padding: 0 20px 10px; display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.3px">blog-engine</h1>
    <span style="font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: {{c.ink2}}">~/code/blog-engine · main</span>
  </div>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 4px 16px">
    <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: {{c.ink2}}">Agents</h2>
    <div style="border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 14px">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.green}}"></span>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 600">drafts <span style="font-weight: 400; font-size: 13px; color: {{c.ink2}}">· done 40 min</span></span>
        <button aria-label="Open drafts's window" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid {{c.line}}; background: {{c.surface2}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 9l3 3-3 3M12.500 15H17"></path></svg></button>
      </div>
    </div>

    <h2 style="margin: 10px 4px 0; font-size: 13px; font-weight: 600; color: {{c.ink2}}">Worktrees</h2>
    <div style="border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 14px; font-size: 15px; color: {{c.ink2}}">No other worktrees.</div>

    <h2 style="margin: 10px 4px 0; font-size: 13px; font-weight: 600; color: {{c.ink2}}">Wrap up</h2>
    <div style="border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column">
      <button style="border: 0; border-bottom: 1px solid {{c.line}}; background: transparent; color: {{c.ink}}; text-align: left; padding: 0 14px; min-height: 52px; display: flex; align-items: center; gap: 12px">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M7 4.500v15a1 1 0 0 0 1.500.860l12-7.500a1 1 0 0 0 0-1.720l-12-7.500A1 1 0 0 0 7 4.500z"></path></svg>
        <span style="flex-grow: 1; font-size: 16px">Run tests</span>
        <span style="font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: {{c.ink2}}">npm test</span>
      </button>
      <button style="border: 0; border-bottom: 1px solid {{c.line}}; background: transparent; color: {{c.accentText}}; text-align: left; padding: 0 14px; min-height: 52px; display: flex; align-items: center; gap: 12px; font-size: 16px; opacity: {{ opacity }}">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M12 17h7"></path></svg>
        Run a command…
      </button>
      <button aria-disabled="{{ disabledText }}" style="border: 0; background: transparent; color: {{c.accentText}}; text-align: left; padding: 0 14px; min-height: 52px; display: flex; align-items: center; gap: 12px; font-size: 16px; opacity: {{ opacity }}">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10l5 3V10l5 3V5h4l1 15zM3 20h18"></path></svg>
        Start a factory here…
      </button>
    </div>
    <sc-if value="{{ hasReason }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; line-height: 17px; color: {{c.ink2}}; padding: 0 4px">{{ reason }}</span>
    </sc-if>

    <button style="margin-top: 10px; height: 50px; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.red}}; font-size: 16px; font-weight: 500">Close space</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "sheet": {"editor": "boolean", "default": false}, "state": {"editor": "enum", "options": ["ready", "shelloff", "outside"], "default": "ready"}, "$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = {"bg": "#FAF8F3", "surface": "#FFFFFF", "surface2": "#F1EEE7", "ink": "#1F1F22", "ink2": "#6B6E75", "line": "#E4E0D7", "accentText": "#8A5700", "green": "#1D6B46", "red": "#B42318"};
    const dark = {"bg": "#16181C", "surface": "#1F2126", "surface2": "#26292F", "ink": "#F5F2EA", "ink2": "#A3A7AF", "line": "#2E3138", "accentText": "#F5B83D", "green": "#5CC792", "red": "#F26B5B"};
    const st = this.props.state ?? 'ready';
    const reason = st === 'shelloff' ? "Commands need the phone shell. Turn on Shell from your phone on your computer’s setup page." : st === 'outside' ? "Commands run only in your project folders. Add this folder to them on your computer." : "";
    return { c: this.props.dark ? dark : light, top: this.props.sheet ? 12 : 54, reason, hasReason: reason !== "", opacity: reason ? 0.45 : 1, disabledText: reason ? "true" : "false" };
  }
}
</script>
</body>
</html>
