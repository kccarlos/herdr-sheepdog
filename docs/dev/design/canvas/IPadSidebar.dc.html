<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — iPad sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<nav aria-label="Sidebar" style="width: 390px; height: 1032px; box-sizing: border-box; display: flex; flex-direction: column; background: {{ c.side }}; border-right: 1px solid {{ c.line }}; color: {{ c.ink }}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: 24px; flex-shrink: 0"></div>
  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 20px">
    <span style="flex-grow: 1; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 22px; font-weight: 700">Sheepdog</span>
    <button aria-label="New (⌘N)" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: {{ c.ink }}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button aria-label="More" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: {{ c.ink }}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="18.5" cy="12" r="1.7"></circle></svg></button>
    <button aria-label="Hide sidebar" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: {{ c.ink }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg></button>
  </header>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 4px 10px; gap: 1px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="20">
      <sc-if value="{{ r.isNav }}" hint-placeholder-val="{{ false }}">
        <button aria-current="{{ r.current }}" style="height: 44px; flex-shrink: 0; border: 0; border-radius: 10px; background: {{ r.bg }}; color: {{ c.ink }}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 16px; font-weight: {{ r.weight }}; text-align: left">
          <sc-if value="{{ r.iconChat }}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></sc-if>
          <sc-if value="{{ r.iconGrid }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect></svg></sc-if>
          <span style="flex-grow: 1">{{ r.label }}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{ c.accentText }}">{{ r.meta }}</span>
        </button>
      </sc-if>
      <sc-if value="{{ r.isComputer }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 0 0 10px; flex-shrink: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{ r.nameColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
          <button aria-expanded="true" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; padding: 0; text-align: left; color: {{ r.nameColor }}; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{ r.label }}</span>
            <span style="font-size: 12px; color: {{ c.muted }}; font-weight: {{ r.subWeight }}">{{ r.sub }}</span>
          </button>
          <button role="radio" aria-checked="{{ r.checked }}" aria-label="{{ r.markLabel }}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
            <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; background: {{ r.markBg }}; border: {{ r.markBorder }}; color: {{ r.markFg }}; display: flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ r.markGlyph }}"></path></svg>
            </span>
          </button>
        </div>
      </sc-if>
      <sc-if value="{{ r.isSpace }}" hint-placeholder-val="{{ false }}">
        <button style="height: 26px; flex-shrink: 0; border: 0; background: transparent; color: {{ c.muted }}; text-align: left; padding: 6px 10px 0; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px">{{ r.label }}<span style="font-weight: 400">{{ r.meta }}</span></button>
      </sc-if>
      <sc-if value="{{ r.isAgent }}" hint-placeholder-val="{{ true }}">
        <button aria-current="{{ r.current }}" style="height: 40px; flex-shrink: 0; border: 0; border-radius: 10px; background: {{ r.bg }}; color: {{ c.ink }}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 15px; font-weight: {{ r.weight }}; text-align: left">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: {{ r.dot }}; flex-shrink: 0"></span>
          <span style="flex-grow: 1">{{ r.label }}</span>
          <sc-if value="{{ r.blocked }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-label="waiting on you" role="img" fill="none" stroke="{{ c.accentText }}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V12M14 11.5V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 14.6a1.5 1.5 0 0 1 2.5-1.7L8 15"></path></svg></sc-if>
          <span style="font-size: 12px; font-weight: {{ r.metaWeight }}; color: {{ r.metaColor }}">{{ r.meta }}</span>
        </button>
      </sc-if>
    </sc-for>
  </div>

</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sel":{"editor":"text","default":"auth-fix"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1032}}'>
class Component extends DCLogic {
  renderVals() {
    const dk = !!this.props.dark;
    const c = dk ? { ring: '#6B707A', side: '#1B1D22', ink: '#F5F2EA', muted: '#A3A7AF', accentText: '#F5B83D', accentSoft: '#2A2416', line: '#2E3138', selBg: '#2C2F36' } : { ring: '#8E8A80', side: '#F3F0E8', ink: '#1F1F22', muted: '#6B6E75', accentText: '#8A5700', accentSoft: '#FDF1DC', line: '#E4E0D7', selBg: '#E5DFD2' };
    const sel = String(this.props.sel ?? 'auth-fix').split(',');
    const base = { isNav: false, isComputer: false, isSpace: false, isAgent: false, iconChat: false, iconGrid: false, talking: false, blocked: false, meta: '', metaColor: c.muted, metaWeight: 400, dot: '#5C6370' };
    const nav = (key, label, icon, meta) => ({ ...base, isNav: true, key, label, meta: meta || '', iconChat: icon === 'chat', iconGrid: icon === 'grid' });
    const wave = 'M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2';
    const pc = (label, kind, sub) => ({ ...base, isComputer: true, label, sub,
      checked: kind === 'here' ? 'true' : 'false', subWeight: kind === 'here' ? 600 : 400, nameColor: kind === 'offline' ? c.muted : c.ink,
      markBg: kind === 'here' ? c.ink : 'transparent', markFg: kind === 'here' ? c.side : c.muted,
      markBorder: kind === 'here' ? '0' : (kind === 'offline' ? '1.5px dashed ' + c.ring : '1.5px solid ' + c.ring),
      markGlyph: kind === 'offline' ? 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5' : wave,
      markLabel: kind === 'here' ? 'The voice is on ' + label : (kind === 'offline' ? 'Retry ' + label : 'Move the voice to ' + label) });
    const sp = (label, meta) => ({ ...base, isSpace: true, label, meta: meta || '' });
    const ag = (label, dot, meta, blocked) => ({ ...base, isAgent: true, key: label, label, dot, meta, blocked: !!blocked, metaColor: blocked ? c.accentText : c.muted, metaWeight: blocked ? 600 : 400 });
    const amber = dk ? '#F0A92A' : '#D99417', blue = dk ? '#6AA8EB' : '#1F5F9E', green = dk ? '#5CC792' : '#1D6B46', idle = dk ? '#9AA1AD' : '#5C6370';
    const rows = [
      nav('conversation', 'Conversation', 'chat'),
      nav('overview', 'All agents', 'grid', '2 waiting'),
      pc('Work Mac', 'here', 'Voice is here'),
      sp('webapp', 'main'),
      ag('auth-fix', amber, 'waiting', true),
      ag('payments', blue, '2 min'),
      sp('docs-site', 'main'),
      ag('api-docs', blue, '12 min'),
      sp('api', 'main'),
      ag('migrate', green, '18 min'),
      ag('search', blue, '31 min'),
      ag('e2e', idle, '40 min'),
      pc('Home Mac', 'other', '2 agents · 1 waiting'),
      sp('site'),
      ag('blog', amber, 'waiting', true),
      sp('scripts'),
      ag('photos', idle, '40 min'),
      pc('Studio mini', 'offline', 'Offline since 9:12')
    ].map((r) => {
      const on = r.key && sel.includes(r.key);
      return { ...r, bg: on ? c.selBg : 'transparent', weight: on ? 600 : (r.isNav ? 500 : 400), current: on ? 'page' : 'false' };
    });
    return { rows, c, dark: dk };
  }
}
</script>
</body>
</html>
