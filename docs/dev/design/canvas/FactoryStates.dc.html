<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — factory empty and error states, each with a plain fix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 4770px; height: 964px; box-sizing: border-box; padding: 40px; display: flex; gap: 40px; background: {{ bg }}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">No project yet</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryNewProject" state="first" h="{{ 844 }}" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Factory not on this computer</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryNewProject" state="nofactory" h="{{ 844 }}" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">No folders to pick</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryNewProject" state="nofolders" h="{{ 844 }}" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Loading a project</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="loading" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Signed out (replaced: no fix line)</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="coordoff" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Not paired: Stop</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="pairagain" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Not paired: the text box</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="pairsay" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Resume refused by a check</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="resumefail" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Too long to send</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="toolong" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Project gone: back on Agents</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryAgents" state="gone" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Can’t load the project</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="loadfail" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 4770, "height": 964}}'>
class Component extends DCLogic {
  renderVals() { const d = !!(this.props.dark ?? false); return { dark: d, bg: d ? "#0E0F12" : "#F3F0E8", ink: d ? "#F5F2EA" : "#1F1F22", line: d ? "#2E3138" : "#E4E0D7" }; }
}
</script>
</body>
</html>
