<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — type instead</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #FAF8F3; color: #1F1F22; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="TopBar" pane="conversation" waiting="0" hint-size="390px,102px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 10px 16px 76px; border-top: 1px solid #E4E0D7">
    <div style="align-self: flex-end; max-width: 78%; padding: 9px 14px; border-radius: 20px 20px 6px 20px; background: #ECE8DF; font-size: 16px; line-height: 21px">What did search change?</div>
    <div style="align-self: flex-start; max-width: 84%; padding: 9px 14px; border-radius: 20px 20px 20px 6px; background: #FFFFFF; border: 1px solid #E4E0D7; font-size: 16px; line-height: 21px">It rebuilt the index on the new schema. Queries are about 30% faster in its benchmark.</div>
    <div style="align-self: flex-end; max-width: 78%; padding: 9px 14px; border-radius: 20px 20px 6px 20px; background: #ECE8DF; font-size: 16px; line-height: 21px">Tell it to open a PR.</div>
    <div style="align-self: flex-start; max-width: 84%; padding: 9px 14px; border-radius: 20px 20px 20px 6px; background: #FFFFFF; border: 1px solid #E4E0D7; font-size: 16px; line-height: 21px">Done. search is opening the PR now.</div>
  </main>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 299px; min-height: 56px; box-sizing: border-box; border-radius: 28px; background: rgba(255,255,255,0.86); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid #E4E0D7; box-shadow: 0 8px 24px rgba(31,31,34,0.12); display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 6px">
    <button aria-label="Back to voice" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: #F1EEE7; color: #1F1F22; box-shadow: inset 0 0 0 1px #E4E0D7; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
    </button>
    <label style="flex-grow: 1; min-width: 0; display: flex">
      <input type="text" value="and remind me when search is done" aria-label="Message to Sheepdog" style="width: 100%; border: 0; background: transparent; font-size: 16px; outline: none; color: #1F1F22">
    </label>
    <button aria-label="Send" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: #1F1F22; color: #FAF8F3; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
    </button>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 291px; box-sizing: border-box; background: #D5D7DD; padding: 8px 3px 0; display: flex; flex-direction: column; gap: 11px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
      <div style="display: flex; justify-content: center; gap: 6px; padding: 0 {{ r.pad }}px">
        <sc-for list="{{ r.keys }}" as="k" hint-placeholder-count="10">
          <span style="flex: 1 1 0; height: 42px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 1px 0 #898A8D"></span>
        </sc-for>
      </div>
    </sc-for>
    <div style="display: flex; gap: 6px; padding: 0 3px">
      <span style="width: 88px; height: 42px; border-radius: 5px; background: #ABB0BA"></span>
      <span style="flex-grow: 1; height: 42px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 1px 0 #898A8D"></span>
      <span style="width: 88px; height: 42px; border-radius: 5px; background: #ABB0BA"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = (c) => Array.from({ length: c }, (_, i) => ({ i }));
    return { rows: [ { pad: 0, keys: n(10) }, { pad: 18, keys: n(9) }, { pad: 46, keys: n(7) } ] };
  }
}
</script>
</body>
</html>
