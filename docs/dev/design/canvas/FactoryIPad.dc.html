<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — iPad, All agents with factory terminals and an ask</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1376px; height: 1032px; display: flex; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="FactoryIPadSidebar" sel="overview" dark="{{ dark }}" style="display: block; width: 390px; height: 1032px; flex-shrink: 0" hint-size="390px,1032px"></dc-import>
  <section aria-label="All agents" style="position: relative; width: 986px; height: 1032px; display: flex; flex-direction: column">
    <div style="height: 24px; flex-shrink: 0"></div>
    <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 24px; border-bottom: 1px solid {{c.line}}">
      <div style="display: flex; flex-direction: column; flex-grow: 1">
        <span style="font-size: 17px; font-weight: 600">All agents</span>
        <span style="font-size: 12px; color: {{c.ink2}}">7 agents on 1 computer · <span style="color: {{c.accentText}}; font-weight: 600">2 waiting</span></span>
      </div>
      <nav aria-label="Filter" style="height: 34px; padding: 3px; box-sizing: border-box; border-radius: 11px; background: {{c.track}}; display: flex; gap: 2px">
        <button aria-current="page" style="border: 0; border-radius: 8px; background: {{c.sel}}; color: {{c.ink}}; font-size: 13px; font-weight: 600; padding: 0 12px">All</button>
        <button style="border: 0; border-radius: 8px; background: transparent; color: {{c.ink}}; font-size: 13px; padding: 0 12px">Waiting</button>
        <button style="border: 0; border-radius: 8px; background: transparent; color: {{c.ink}}; font-size: 13px; padding: 0 12px">Working</button>
      </nav>
    </header>
    <main style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 14px 24px 0; display: flex; flex-direction: column; gap: 12px">
      <dc-import name="AgentSection" label="Needs you" count="2" w="{{ 938 }}" dark="{{ dark }}" style="display: block" hint-size="938px,24px"></dc-import>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start">
        <section aria-label="The herdr-sheepdog factory asks about a release" style="box-sizing: border-box; padding: 14px; border-radius: 14px; background: {{c.accentTint}}; border: 1px solid {{c.blocked}}; display: flex; flex-direction: column; gap: 10px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{c.accentText}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.blocked}}"></span>herdr-sheepdog factory · release</span>
          <span style="font-family: Outfit, Inter, system-ui, sans-serif; font-size: 20px; line-height: 25px; font-weight: 600">Tag 0.1.31 now?</span>
          <span style="font-size: 15px; line-height: 21px">Milestone 2 is accepted and main is green. Nothing else is waiting.</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.accent}}; color: #1F1F22; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">Tag 0.1.31<span style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 9px; background: {{c.accentTint}}; color: {{c.accentText}}">Recommended</span></button>
            <button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 15px">Wait for one more QA pass</button>
            <button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 15px">Not now</button>
          </div>
        </section>
        <article aria-label="SDF-57 worker, factory, waiting at a prompt for 14 minutes" style="box-sizing: border-box; border-radius: 14px; background: {{c.surface}}; border: 1.5px solid {{c.blocked}}; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 7px">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.blocked}}"></span>
            <span style="font-size: 16px; font-weight: 600">SDF-57</span>
            <span style="font-size: 12px; color: {{c.ink2}}">codex · worker · factory, not announced</span>
            <span style="flex-grow: 1"></span>
            <span style="font-size: 13px; font-weight: 600; color: {{c.accentText}}">Waiting · 14 min</span>
          </div>
          <span style="font-size: 14px; line-height: 19px">Waiting at a prompt on its screen.</span>
          <button style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 15px; font-weight: 600">Open window</button>
        </article>
      </div>
      <dc-import name="AgentSection" label="Working" count="5" w="{{ 938 }}" dark="{{ dark }}" style="display: block" hint-size="938px,24px"></dc-import>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{ working }}" as="r" hint-placeholder-count="3">
            <button aria-label="{{ r.aria }}" style="min-height: 70px; box-sizing: border-box; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 9px 12px 9px 14px; display: flex; flex-direction: column; gap: 3px; color: {{c.ink}}; text-align: left">
              <span style="display: flex; align-items: center; gap: 7px; width: 100%"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.blue}}; flex-shrink: 0"></span><span style="font-size: 16px; font-weight: 600">{{ r.name }}</span><span style="font-size: 12px; color: {{c.ink2}}">{{ r.kind }}</span><span style="flex-grow: 1"></span><span style="font-size: 13px; color: {{c.ink2}}">{{ r.state }}</span></span>
              <span style="font-size: 14px; line-height: 18px; padding-left: 15px">{{ r.line }}</span>
              <span style="font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; font-size: 11.5px; color: {{c.ink2}}; padding-left: 15px">{{ r.model }}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <dc-import name="AgentCard" agent="payments" open="{{ false }}" dark="{{ dark }}" w="{{ 462 }}" style="display: block; width: 462px" hint-size="462px,70px"></dc-import>
          <dc-import name="AgentCard" agent="api-docs" open="{{ false }}" dark="{{ dark }}" w="{{ 462 }}" style="display: block; width: 462px" hint-size="462px,70px"></dc-import>
        </div>
      </div>
      <dc-import name="AgentSection" label="Done" count="1" w="{{ 938 }}" dark="{{ dark }}" style="display: block" hint-size="938px,24px"></dc-import>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start">
        <button aria-label="SDF-55, claude worker, done 18 minutes ago, factory, not announced" style="min-height: 56px; box-sizing: border-box; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 9px 12px 9px 14px; display: flex; flex-direction: column; gap: 3px; color: {{c.ink}}; text-align: left">
          <span style="display: flex; align-items: center; gap: 7px; width: 100%"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.green}}; flex-shrink: 0"></span><span style="font-size: 16px; font-weight: 600">SDF-55</span><span style="font-size: 12px; color: {{c.ink2}}">claude · worker · factory, not announced</span><span style="flex-grow: 1"></span><span style="font-size: 13px; color: {{c.ink2}}">Done · 18 min</span></span>
          <span style="font-size: 14px; line-height: 18px; padding-left: 15px">Ready. Waiting on CI.</span>
        </button>
      </div>
    </main>
    <div style="position: absolute; left: 310px; bottom: 26px; width: 366px; height: 60px; display: flex">
      <dc-import name="Dock" label="Work Mac" status="Listening" mode="quiet" dark="{{ dark }}" style="display: block; width: 366px; height: 60px" hint-size="366px,60px"></dc-import>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 1376, "height": 1032}}'>
class Component extends DCLogic {
  renderVals() {
    const light = {"bg": "#FAF8F3", "surface": "#FFFFFF", "track": "#ECE8DF", "sel": "#FFFFFF", "ink": "#1F1F22", "ink2": "#6B6E75", "line": "#E4E0D7", "accent": "#D98718", "accentText": "#8A5700", "accentTint": "#FDF1DC", "blocked": "#D99417", "blue": "#1F5F9E", "green": "#1D6B46"};
    const dark = {"bg": "#16181C", "surface": "#1F2126", "track": "#26292F", "sel": "#3A3D44", "ink": "#F5F2EA", "ink2": "#A3A7AF", "line": "#2E3138", "accent": "#F39C1F", "accentText": "#F5B83D", "accentTint": "#2A2416", "blocked": "#F0A92A", "blue": "#6AA8EB", "green": "#5CC792"};
    const d = !!this.props.dark;
    const c = d ? dark : light;
    const working = [
      ["coordinator", "claude · factory", "Working · 2 min", "herdr-sheepdog: accepting SDF-41", "claude-opus-5-5 · high"],
      ["SDF-53", "codex · worker · factory, not announced", "Working · 31 min", "Codex launch flags: make test, 12m left", "gpt-6.2-sol · high"],
      ["SDF-48", "claude · reviewer · factory, not announced", "Working · 6 min", "Review round 2 of 2, read-only", "claude-fable-5-2"]
    ].map((r) => ({ name: r[0], kind: r[1], state: r[2], line: r[3], model: r[4], aria: r[0] + ", " + r[1] + ", " + r[2] }));
    return { c, dark: d, working };
  }
}
</script>
</body>
</html>
