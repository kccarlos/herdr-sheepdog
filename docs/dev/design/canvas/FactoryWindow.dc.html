<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — the coordinator's window: a read-only snapshot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: 54px; flex-shrink: 0"></div>
  <header style="height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; padding: 0 4px; border-bottom: 1px solid {{c.line}}">
    <a href="FactoryProject.dc.html" aria-label="Back to notes" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{c.ink}}; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center; min-width: 0">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.blue}}"></span>notes coordinator</span>
      <span style="font-size: 12px; color: {{c.ink2}}">claude · claude-opus-5-5 · high</span>
    </div>
    <span></span>
  </header>
  <div role="note" style="flex-shrink: 0; display: flex; align-items: flex-start; gap: 8px; padding: 9px 14px; border-bottom: 1px solid {{c.line}}; background: {{c.surface2}}; font-size: 12.5px; line-height: 17px; color: {{c.fill2}}">
    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    <span>View only. To tell the coordinator something, use the box on the notes page. An ask is answered on its card.</span>
  </div>
  <main aria-label="The coordinator's terminal, a snapshot" style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 10px 14px; display: flex; flex-direction: column; font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 18px">
    <sc-for list="{{ lines }}" as="l" hint-placeholder-count="14">
      <div style="white-space: pre-wrap; color: {{ l.color }}">{{ l.t }}</div>
    </sc-for>
  </main>
  <div role="status" style="flex-shrink: 0; padding: 10px 16px 34px; border-top: 1px solid {{c.line}}; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: {{c.ink2}}">
    <span style="width: 7px; height: 7px; border-radius: 4px; background: {{c.green}}"></span>Updated 2 s ago
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = {"bg": "#FAF8F3", "surface2": "#F1EEE7", "ink": "#1F1F22", "ink2": "#6B6E75", "fill2": "#5C5F66", "line": "#E4E0D7", "blue": "#1F5F9E", "green": "#1D6B46"};
    const dark = {"bg": "#16181C", "surface2": "#26292F", "ink": "#F5F2EA", "ink2": "#A3A7AF", "fill2": "#A3A7AF", "line": "#2E3138", "blue": "#6AA8EB", "green": "#5CC792"};
    const d = !!this.props.dark;
    const c = d ? dark : light;
    const raw = [
      ["Wake: owner said (typed): \"skip the export task\"", "ink"],
      ["● factory task drop T9", "ink"],
      ["  --why \"owner said to skip the export\"", "ink2"],
      ["  ⎿ T9 dropped", "ink2"],
      ["", "ink"],
      ["Wake: event:review T8, changes asked", "ink"],
      ["● factory task send-back T8", "ink"],
      ["  --why \"the tag index must be", "ink2"],
      ["  case-insensitive\"", "ink2"],
      ["  ⎿ T8 back to implementing", "ink2"],
      ["", "ink"],
      ["Wake: event:ask T10 open", "ink"],
      ["  Delete the old notes table?", "ink2"],
      ["  waiting on the owner", "ink2"],
      ["", "ink"],
      ["Idle. Next wake on a change.", "ink2"]
    ];
    const lines = raw.map((l) => ({ t: l[0] === "" ? " " : l[0], color: l[1] === "ink2" ? c.ink2 : c.ink }));
    return { c, lines };
  }
}
</script>
</body>
</html>
