<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — the coordinator's window: live, and you can type in it</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: {{ h }}px; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: 54px; flex-shrink: 0"></div>
  <header style="min-height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; padding: 4px 4px; box-sizing: border-box; border-bottom: 1px solid {{c.line}}">
    <a href="FactoryProject.dc.html" aria-label="Back to notes" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{c.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 aria-label="{{ s.titleAria }}" style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; column-gap: 6px; min-width: 0; text-align: center; font-size: {{ f.title }}px; line-height: 1.2; font-weight: 600"><span style="display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere"><span aria-hidden="true" style="flex-shrink: 0; width: 8px; height: 8px; border-radius: 4px; background: {{ s.dot }}"></span>notes</span><span style="font-weight: 500; color: {{c.ink2}}">· Coordinator</span></h1>
    <span></span>
  </header>

  <sc-if value="{{ s.live }}" hint-placeholder-val="{{ true }}">
    <main aria-label="The notes coordinator's terminal, live" style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 18px">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="18">
        <div style="white-space: pre-wrap; color: {{ l.color }}; font-weight: {{ l.weight }}">{{ l.t }}</div>
      </sc-for>
    </main>

    <a href="FactoryProject.dc.html" style="flex-shrink: 0; margin: 0 10px 8px; min-height: 44px; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; background: {{c.askBg}}; border: 1px solid {{c.blocked}}; display: flex; align-items: center; gap: 8px; font-size: {{ f.strip }}px; line-height: 1.35; color: {{c.ink}}">
      <span style="flex-grow: 1; min-width: 0"><b style="font-weight: 600">T10 is waiting on your answer.</b> Answer it on its card; typing here is not an answer.</span>
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: {{c.chevron}}"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div role="toolbar" aria-label="Keys" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 10px 8px">
      <button aria-label="Escape" style="height: {{ f.key }}px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-family: 'SF Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500">esc</button>
      <button aria-label="Tab" style="height: {{ f.key }}px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-size: 16px">⇥</button>
      <button aria-label="Up" style="height: {{ f.key }}px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-size: 16px">↑</button>
      <button aria-label="Down" style="height: {{ f.key }}px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-size: 16px">↓</button>
      <button aria-label="Return" style="height: {{ f.key }}px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-size: 16px">⏎</button>
      <button aria-label="Type in the terminal" style="height: {{ f.key }}px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; "><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg></button>
      <button aria-label="More keys" style="height: {{ f.key }}px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; "><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18.5" cy="12" r="1.6"></circle></svg></button>
    </div>

    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px 34px">
      <label style="flex-grow: 1; min-width: 0; min-height: 40px; border-radius: 20px; border: 1px solid {{c.line}}; background: {{c.surface}}; display: flex; align-items: center; padding: 0 6px 0 14px; box-sizing: border-box">
        <input type="text" placeholder="Ask the notes coordinator…" aria-label="Message to the notes coordinator" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; outline: none; color: {{c.ink}}">
        <button aria-label="Send" style="width: 30px; height: 30px; border-radius: 15px; border: 0; background: {{c.line}}; color: {{c.surface}}; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
      </label>
    </div>
  </sc-if>

  <sc-if value="{{ s.off }}" hint-placeholder-val="{{ false }}">
    <main aria-label="{{ s.offTitle }}" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 24px 80px; text-align: center">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{c.ink2}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M7 9l3 3-3 3M13 15h4"></path></svg>
      <h2 style="margin: 0; font-size: {{ f.h2 }}px; line-height: 1.25; font-weight: 600; overflow-wrap: anywhere">{{ s.offTitle }}</h2>
      <sc-if value="{{ s.alert }}" hint-placeholder-val="{{ true }}">
        <div role="status" style="align-self: stretch; padding: 10px 12px; border-radius: 12px; background: {{c.surface}}; border: 1px dashed {{c.dash}}; display: flex; flex-direction: column; gap: 3px; text-align: left; font-size: {{ f.small }}px; line-height: 1.35">
          <span style="font-weight: 600">claude coordinator is signed out</span>
          <span><span style="font-weight: 600">Fix:</span> sign in to claude at this Mac (Work Mac). Running tasks go on.</span>
        </div>
      </sc-if>
      <p style="margin: 0; font-size: {{ f.body }}px; line-height: 1.4; color: {{c.ink2}}">{{ s.offBody }}</p>
      <a href="FactoryProject.dc.html" style="margin-top: 4px; min-height: 44px; padding: 8px 22px; box-sizing: border-box; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: {{ f.btn }}px; font-weight: 600; display: flex; align-items: center">Back to notes</a>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "ax": {"editor": "boolean", "default": false}, "state": {"editor": "enum", "options": ["running", "coordoff", "stopped", "finished"], "default": "running"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = {"bg": "#FAF8F3", "surface": "#FFFFFF", "ink": "#1F1F22", "ink2": "#6B6E75", "line": "#E4E0D7", "blue": "#1F5F9E", "green": "#1D6B46", "idle": "#5C6370", "blocked": "#D99417", "askBg": "#FDF1DC", "chevron": "#8E929A", "dash": "#8E8A80"};
    const dark = {"bg": "#16181C", "surface": "#1F2126", "ink": "#F5F2EA", "ink2": "#A3A7AF", "line": "#2E3138", "blue": "#6AA8EB", "green": "#5CC792", "idle": "#9AA1AD", "blocked": "#F0A92A", "askBg": "#2E2615", "chevron": "#8E929A", "dash": "#6B707A"};
    const d = !!this.props.dark, ax = !!this.props.ax;
    const c = d ? dark : light;
    const st = this.props.state ?? 'running';
    const raw = [
      ["● factory task send-back T8", "ink", 400],
      ["  --why \"the tag index must be", "ink2", 400],
      ["  case-insensitive\"", "ink2", 400],
      ["  ⎿ T8 back to implementing", "ink2", 400],
      ["", "ink", 400],
      ["● factory ask T10 \"Delete the old notes", "ink", 400],
      ["  table in the migration?\"", "ink", 400],
      ["  ⎿ waiting on the owner", "ink2", 400],
      ["", "ink", 400],
      ["> Why does T10 want to drop the old table?", "ink", 600],
      ["", "ink", 400],
      ["● The import writes to notes_v2. Only the", "ink", 400],
      ["  export read the old table, and the export", "ink", 400],
      ["  task (T9) was dropped, so nothing reads it", "ink", 400],
      ["  after T10. Keeping it means a second", "ink", 400],
      ["  migration later. Your call, on its card.", "ink", 400],
      ["", "ink", 400],
      ["> █", "ink", 400]
    ];
    const col = { ink: c.ink, ink2: c.ink2 };
    const lines = raw.map((l) => ({ t: l[0] === "" ? " " : l[0], color: col[l[1]], weight: l[2] }));
    const off = st !== 'running';
    const titles = { coordoff: "The notes coordinator is not running", stopped: "notes is stopped", finished: "notes is finished" };
    const bodies = {
      coordoff: "This window comes back when a coordinator runs again. To tell it something meanwhile, use the box on the notes page; it gets it when it is back.",
      stopped: "Resume notes on its page; it goes on with the same goal.",
      finished: "To go on, reopen notes with a new goal on its page."
    };
    const s = {
      live: !off, off, alert: st === 'coordoff',
      dot: off ? c.idle : c.blue,
      titleAria: off ? "notes coordinator, not running" : "notes coordinator, running",
      offTitle: titles[st] || "", offBody: bodies[st] || ""
    };
    return {
      c, s, lines, h: ax ? 1440 : 844,
      f: ax ? { title: 34, h2: 40, body: 34, small: 30, btn: 34, strip: 30, key: 52 } : { title: 17, h2: 20, body: 15, small: 14, btn: 15, strip: 14, key: 40 }
    };
  }
}
</script>
</body>
</html>
