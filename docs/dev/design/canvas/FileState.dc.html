<!doctype html>

<x-dc>

<style>

</helmet>
<div style="position: relative; width: 390px; height: 560px; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

    <sc-if value="{{ s.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{c.ink2}}" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"><path d="{{ s.icon }}"></path></svg></sc-if>
    <h1 style="margin: 2px 0 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 22px; font-weight: 700">{{ s.t }}</h1>
    <p style="margin: 0; font-size: 15px; line-height: 20px; color: {{c.ink2}}">{{ s.b }}</p>
    <sc-if value="{{ s.sleep }}" hint-placeholder-val="{{ false }}"><ul style="margin: 2px 0 0; padding: 12px 14px; list-style: none; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 8px; text-align: left; align-self: stretch"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 20px"><span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 10px; background: {{c.surface2}}; color: {{c.ink2}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">1</span>Is the Mac awake?</li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 20px"><span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 10px; background: {{c.surface2}}; color: {{c.ink2}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span>Is sheepdog running there?</li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 20px"><span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 10px; background: {{c.surface2}}; color: {{c.ink2}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span>Are this phone and the Mac on the same Tailscale network?</li></ul></sc-if>
    <sc-if value="{{ s.hasP }}" hint-placeholder-val="{{ true }}"><button style="margin-top: 6px; min-height: 44px; padding: 0 20px; border-radius: 22px; border: 1.5px solid {{c.ink}}; background: transparent; color: {{c.ink}}; font-size: 16px; font-weight: 600">{{ s.p }}</button></sc-if>
  </main>
</div>
</x-dc>
