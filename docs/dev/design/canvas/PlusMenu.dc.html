<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — + menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF8F3; color: #1F1F22; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="TopBar" pane="agents" waiting="1" hint-size="390px,102px"></dc-import>
  <div style="padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #E4E0D7">
    <div style="height: 128px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #D98718"></div>
    <div style="height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>
    <div style="height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>
    <div style="height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>
    <div style="height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>
    <div style="height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>
    <div style="height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>
    <div style="height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>
  </div>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(250,248,243,0.55)"></div>

  <div role="menu" aria-label="New" style="position: absolute; top: 104px; right: 12px; width: 268px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 12px 40px rgba(31,31,34,0.18), 0 0 0 1px #E4E0D7; display: flex; flex-direction: column; overflow: hidden">
    <button role="menuitem" style="border: 0; border-bottom: 1px solid #E4E0D7; background: transparent; color: #1F1F22; text-align: left; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 52px">
      <span style="flex-grow: 1; font-size: 16px">New agent</span>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 9l3 3-3 3M12.5 15H17"></path><path d="M18 2v4M16 4h4"></path></svg>
    </button>
    <button role="menuitem" aria-disabled="true" style="border: 0; background: transparent; color: #6B6E75; text-align: left; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 60px; cursor: default">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px">New shell</span>
        <span style="font-size: 13px; line-height: 17px">The shell is off on this network.</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M12 17h7"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 12px; bottom: 26px; width: 366px; height: 60px; display: flex">
    <dc-import name="Dock" label="Sheepdog" status="Listening" mode="quiet" style="display: block; width: 366px; height: 60px" hint-size="366px,60px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
