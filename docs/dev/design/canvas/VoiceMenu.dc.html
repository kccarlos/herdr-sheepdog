<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — voice menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #FAF8F3; color: #1F1F22; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="TopBar" pane="conversation" waiting="1" hint-size="390px,102px"></dc-import>
  <div style="flex-shrink: 0; display: flex; gap: 6px; padding: 4px 16px 8px; overflow: hidden; border-bottom: 1px solid #E4E0D7">
    <sc-for list="{{ strip }}" as="s" hint-placeholder-count="4">
      <span style="flex-shrink: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 16px; border: 1px solid #E4E0D7; background: #FFFFFF; font-size: 14px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{ s.color }}"></span>{{ s.name }}</span>
    </sc-for>
  </div>
  <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 0">
    <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="8">
      <div style="align-self: {{ m.align }}; max-width: {{ m.max }}; padding: 9px 14px; border-radius: {{ m.radius }}; background: {{ m.bg }}; border: {{ m.border }}; font-size: 16px; line-height: 21px">{{ m.text }}</div>
    </sc-for>
  </main>

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(250,248,243,0.55)"></div>

  <div role="menu" aria-label="Voice session" style="position: absolute; left: 66px; bottom: 96px; width: 290px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 12px 40px rgba(31,31,34,0.18), 0 0 0 1px #E4E0D7; display: flex; flex-direction: column; overflow: hidden">
    <span style="padding: 10px 16px 4px; font-size: 12px; font-weight: 600; color: #6B6E75">Talk to</span>
    <button role="menuitemradio" aria-checked="true" style="border: 0; background: transparent; color: #1F1F22; text-align: left; padding: 6px 16px; min-height: 52px; display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">Work Mac</span><span style="font-size: 12px; color: #6B6E75">5 agents · <span style="color: #8A5700; font-weight: 600">1 waiting</span></span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </button>
    <button role="menuitemradio" aria-checked="false" style="border: 0; background: transparent; color: #1F1F22; text-align: left; padding: 6px 16px; min-height: 52px; display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">Home Mac</span><span style="font-size: 12px; color: #6B6E75">2 agents · <span style="color: #8A5700; font-weight: 600">1 waiting</span></span></span>
    </button>
    <button role="menuitemradio" aria-checked="false" aria-disabled="true" style="border: 0; background: transparent; color: #6B6E75; text-align: left; padding: 6px 16px; min-height: 52px; display: flex; align-items: center; gap: 10px; cursor: default">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">Studio mini</span><span style="font-size: 12px">Offline since 9:12</span></span>
    </button>
    <button role="menuitem" style="border: 0; border-top: 1px solid #E4E0D7; background: transparent; color: #1F1F22; text-align: left; padding: 0 16px; min-height: 48px; display: flex; align-items: center; gap: 10px; font-size: 16px">
      <span style="flex-grow: 1">Manage computers…</span>
      <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#8E929A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <div style="height: 8px; background: #F1EEE7"></div>
    <button role="menuitem" style="border: 0; background: transparent; color: #B42318; text-align: left; padding: 0 16px; min-height: 50px; display: flex; align-items: center; gap: 10px">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">End voice session</span><span style="font-size: 12px; color: #6B6E75">Your agents keep working.</span></span>
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 12px; bottom: 26px; width: 366px; height: 60px; display: flex">
    <dc-import name="Dock" label="Work Mac" status="Listening" mode="quiet" open="{{ true }}" style="display: block; width: 366px; height: 60px" hint-size="366px,60px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const you = { align: 'flex-end', max: '78%', radius: '20px 20px 6px 20px', bg: '#ECE8DF', border: '0' };
    const dog = { align: 'flex-start', max: '84%', radius: '20px 20px 20px 6px', bg: '#FFFFFF', border: '1px solid #E4E0D7' };
    const msgs = [
      Object.assign({ text: 'What did search change?' }, you),
      Object.assign({ text: 'It rebuilt the index on the new schema. Queries are about 30% faster in its benchmark.' }, dog),
      Object.assign({ text: 'Good. Tell it to open a PR.' }, you),
      Object.assign({ text: 'Done. search is opening the PR now.' }, dog),
      Object.assign({ text: 'Anything waiting on me?' }, you),
      Object.assign({ text: 'One thing: auth-fix wants to run the tests.' }, dog),
      Object.assign({ text: 'Let it run them.' }, you),
      Object.assign({ text: 'Done. auth-fix is running the tests.' }, dog)
    ];
    return { msgs, strip: [
      { name: 'auth-fix', color: '#D99417' }, { name: 'search', color: '#1F5F9E' }, { name: 'payments', color: '#1F5F9E' }, { name: 'api-docs', color: '#1F5F9E' }
    ] };
  }
}
</script>
</body>
</html>
