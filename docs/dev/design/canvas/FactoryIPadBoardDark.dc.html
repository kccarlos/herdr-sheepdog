<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — iPad, a project: list and graph, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1376px; height: 1032px; background: {{ bg }}">
  <dc-import name="FactoryIPadBoard" dark="{{ true }}" style="display: block" hint-size="1376px,1032px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": true}, "$preview": {"width": 1376, "height": 1032}}'>
class Component extends DCLogic {
  renderVals() { const d = this.props.dark ?? true; return { dark: !!d, bg: d ? "#16181C" : "#FAF8F3" }; }
}
</script>
</body>
</html>
