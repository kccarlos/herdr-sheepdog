<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — the coordinator's window when no coordinator runs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1330px; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: repeat(3, 390px); gap: 28px 40px; align-items: start; background: {{ bg }}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 18px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Coordinator not running: no keys, no box</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryWindow" state="coordoff" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 18px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Project stopped: resume on its page</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryWindow" state="stopped" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 18px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Running, dark</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryWindow" state="running" dark="{{ true }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 1330, "height": 962}}'>
class Component extends DCLogic {
  renderVals() { const d = !!this.props.dark; return { dark: d, bg: d ? "#0E0F12" : "#F3F0E8", ink: d ? "#F5F2EA" : "#1F1F22", line: d ? "#2E3138" : "#E4E0D7" }; }
}
</script>
</body>
</html>
