<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F1EEE7; color: #1F1F22; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: 64px; flex-shrink: 0"></div>
  <div style="flex-grow: 1; min-height: 0; border-radius: 22px 22px 0 0; background: #FAF8F3; display: flex; flex-direction: column; overflow: hidden">
    <span style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #CFC9BC; margin-top: 7px"></span>
    <header style="height: 50px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; padding: 0 12px">
      <span></span>
      <h1 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 18px; font-weight: 600">Settings</h1>
      <div style="display: flex; justify-content: flex-end"><button style="height: 40px; border: 0; background: transparent; color: #8A5700; font-size: 16px; font-weight: 600; padding: 0 8px">Done</button></div>
    </header>

    <main style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 8px 16px 0; font-size: 13px; font-weight: 600; color: #6B6E75">Computers</h2>
      <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; display: flex; flex-direction: column">
        <sc-for list="{{ computers }}" as="pc" hint-placeholder-count="3">
          <button style="border: 0; border-bottom: 1px solid #E4E0D7; background: transparent; color: #1F1F22; text-align: left; padding: 9px 14px; min-height: 58px; display: flex; align-items: center; gap: 12px">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{ pc.iconColor }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 16px; color: {{ pc.nameColor }}">{{ pc.name }}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B6E75"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{ pc.dot }}"></span>{{ pc.sub }}</span>
            </span>
            <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#8E929A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
        <button style="border: 0; background: transparent; color: #8A5700; text-align: left; padding: 0 14px; min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: 16px">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h3v3H8zM13 13h3v3h-3zM13 9h3M8 15h2"></path></svg>
          Add a computer
        </button>
      </div>
      <p style="margin: 0 16px 6px; font-size: 13px; line-height: 18px; color: #6B6E75">Each computer keeps its own address, models, languages and notifications. With one computer this section is a single row.</p>

      <h2 style="margin: 8px 16px 0; font-size: 13px; font-weight: 600; color: #6B6E75">This phone</h2>
      <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; display: flex; flex-direction: column">
        <sc-for list="{{ phone }}" as="r" hint-placeholder-count="2">
          <button style="border: 0; border-bottom: {{ r.sep }}; background: transparent; color: #1F1F22; text-align: left; padding: 0 14px; min-height: 48px; display: flex; align-items: center; gap: 12px">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 7px; background: #F1EEE7; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{ r.wave }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg></sc-if>
              <sc-if value="{{ r.bell }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg></sc-if>
              <sc-if value="{{ r.steth }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v5a5 5 0 0 0 10 0V3M9 13v2a5 5 0 0 0 10 0v-1"></path><circle cx="19" cy="12" r="2"></circle></svg></sc-if>
              <sc-if value="{{ r.info }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></sc-if>
            </span>
            <span style="flex-grow: 1; font-size: 16px">{{ r.label }}</span>
            <span style="font-size: 15px; color: #6B6E75">{{ r.value }}</span>
            <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#8E929A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>

      <h2 style="margin: 14px 16px 0; font-size: 13px; font-weight: 600; color: #6B6E75">Help</h2>
      <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; display: flex; flex-direction: column">
        <sc-for list="{{ help }}" as="r" hint-placeholder-count="2">
          <button style="border: 0; border-bottom: {{ r.sep }}; background: transparent; color: #1F1F22; text-align: left; padding: 0 14px; min-height: 48px; display: flex; align-items: center; gap: 12px">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 7px; background: #F1EEE7; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{ r.steth }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v5a5 5 0 0 0 10 0V3M9 13v2a5 5 0 0 0 10 0v-1"></path><circle cx="19" cy="12" r="2"></circle></svg></sc-if>
              <sc-if value="{{ r.info }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></sc-if>
            </span>
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">{{ r.label }}</span><span style="font-size: 12px; color: #6B6E75">{{ r.sub }}</span></span>
            <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#8E929A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>

      <button style="margin-top: 12px; border-radius: 14px; border: 1px solid #E4E0D7; background: #FFFFFF; color: #1F1F22; text-align: left; padding: 0 14px; min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: 16px">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5v7l6-3.5z"></path></svg>
        Try the demo
      </button>
      <p style="margin: 0 16px; font-size: 13px; line-height: 18px; color: #6B6E75">Scripted agents on this phone. No computer, no network.</p>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const line = '1px solid #E4E0D7';
    return {
      computers: [
        { name: 'Work Mac', sub: 'Talking here · 100.101.4.12', dot: '#1D6B46', iconColor: '#1F1F22', nameColor: '#1F1F22' },
        { name: 'Home Mac', sub: 'Connected · 100.88.20.3', dot: '#1D6B46', iconColor: '#1F1F22', nameColor: '#1F1F22' },
        { name: 'Studio mini', sub: 'Offline since 9:12', dot: '#8E929A', iconColor: '#8E929A', nameColor: '#6B6E75' }
      ],
      phone: [
        { label: 'Voice', value: 'Open mic', wave: true, bell: false, steth: false, info: false, sep: line },
        { label: 'Notifications', value: 'On', wave: false, bell: true, steth: false, info: false, sep: '0' }
      ],
      help: [
        { label: 'Diagnostics', sub: 'Health, audio path, voice detection', steth: true, info: false, sep: line },
        { label: 'About', sub: 'Versions, clear the cached conversation', steth: false, info: true, sep: '0' }
      ]
    };
  }
}
</script>
</body>
</html>
