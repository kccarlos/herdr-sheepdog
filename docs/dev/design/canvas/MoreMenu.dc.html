<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — ⋯ menu</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF8F3; color: #1F1F22; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="TopBar" pane="conversation" waiting="1" hint-size="390px,102px"></dc-import>
  <div style="padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #E4E0D7">
    <div style="align-self: flex-end; width: 150px; height: 40px; border-radius: 20px; background: #ECE8DF"></div>

    <div style="align-self: flex-end; width: 200px; height: 40px; border-radius: 20px; background: #ECE8DF"></div>
    <div style="align-self: flex-start; width: 290px; height: 106px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>

    <div style="align-self: flex-start; width: 250px; height: 62px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E0D7"></div>

    <button role="menuitem" style="border: 0; border-bottom: 1px solid #E4E0D7; background: transparent; color: #1F1F22; text-align: left; padding: 0 16px; display: flex; align-items: center; gap: 12px; min-height: 48px">
      <span style="flex-grow: 1; font-size: 16px">New conversation</span>
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg>
    </button>
    <button role="menuitem" style="border: 0; border-bottom: 1px solid #E4E0D7; background: transparent; color: #1F1F22; text-align: left; padding: 0 16px; display: flex; align-items: center; gap: 12px; min-height: 48px">
      <span style="flex-grow: 1; font-size: 16px">Stop Sheepdog</span>
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><rect x="9" y="9" width="6" height="6" rx="1"></rect></svg>
    </button>
    <button role="menuitem" style="border: 0; background: transparent; color: #1F1F22; text-align: left; padding: 0 16px; display: flex; align-items: center; gap: 12px; min-height: 48px">
      <span style="flex-grow: 1; font-size: 16px; color: #B42318">End voice session</span>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="height: 8px; background: #F1EEE7"></div>
    <button role="menuitem" style="border: 0; border-bottom: 1px solid #E4E0D7; background: transparent; color: #1F1F22; text-align: left; padding: 0 16px; display: flex; align-items: center; gap: 12px; min-height: 48px">
      <span style="flex-grow: 1; font-size: 16px">Spaces</span>
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    </button>
    <button role="menuitem" style="border: 0; background: transparent; color: #1F1F22; text-align: left; padding: 0 16px; display: flex; align-items: center; gap: 12px; min-height: 48px">
      <span style="flex-grow: 1; font-size: 16px">Settings</span>
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 12px; bottom: 26px; width: 366px; height: 60px; display: flex">
    <dc-import name="Dock" label="Sheepdog" status="Sheepdog is talking" mode="speaking" style="display: block; width: 366px; height: 60px" hint-size="366px,60px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }

</script>
</body>
</html>
