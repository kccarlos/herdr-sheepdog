<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — the terminal running factory start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: 54px; flex-shrink: 0"></div>
  <header style="height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; padding: 0 4px; border-bottom: 1px solid {{c.line}}">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div style="display: flex; flex-direction: column; align-items: center; min-width: 0">
      <span style="font-size: 17px; font-weight: 600">sheepdog</span>
      <span style="font-size: 12px; color: {{c.ink2}}">blog-engine</span>
    </div>
    <button aria-label="Actions" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="18.5" cy="12" r="1.7"></circle></svg></button>
  </header>

  <main aria-label="Terminal" style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 10px 14px; display: flex; flex-direction: column; font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 18px; color: {{c.ink}}">
    <sc-for list="{{ lines }}" as="l" hint-placeholder-count="26">
      <div style="white-space: pre; font-weight: {{ l.weight }}"><span style="color: {{ l.tagColor }}">{{ l.tag }}</span>{{ l.t }}</div>
    </sc-for>
  </main>

  <div role="toolbar" aria-label="Keys" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 10px 34px">
    <button aria-label="Escape" style="height: 40px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-family: 'SF Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500">esc</button>
    <button aria-label="Tab" style="height: 40px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 16px">⇥</button>
    <button aria-label="Up" style="height: 40px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 16px">↑</button>
    <button aria-label="Down" style="height: 40px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 16px">↓</button>
    <button aria-label="Return" style="height: 40px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 16px">⏎</button>
    <button aria-label="Control C" style="height: 40px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; font-family: 'SF Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500">⌃C</button>
    <button aria-label="More keys" style="height: 40px; border-radius: 10px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18.5" cy="12" r="1.6"></circle></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "state": {"editor": "enum", "options": ["ok", "fail"], "default": "ok"}, "$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = {"bg": "#FAF8F3", "surface": "#FFFFFF", "ink": "#1F1F22", "ink2": "#6B6E75", "line": "#E4E0D7", "ok": "#1D6B46", "warn": "#8A5700", "fail": "#B42318"};
    const dark = {"bg": "#16181C", "surface": "#1F2126", "ink": "#F5F2EA", "ink2": "#A3A7AF", "line": "#2E3138", "ok": "#5CC792", "warn": "#F5B83D", "fail": "#F26B5B"};
    const c = this.props.dark ? dark : light;
    const fail = (this.props.state ?? 'ok') === 'fail';
    const L = (t, tag, bold) => ({ t: t === "" ? " " : t, tag: tag ? (tag + "      ").slice(0, 6) : "", tagColor: tag === "ok" ? c.ok : tag === "WARN" ? c.warn : tag === "FAIL" ? c.fail : c.ink, weight: bold ? 700 : 400 });
    const head = [L("$ sheepdog factory start"), L("Checking this computer"), L("engine", "ok"), L("git repository, branch main", "ok"), L("a pull-request workflow exists", "ok")];
    const okBody = [
      L("claude and codex signed in", "ok"),
      L("models: opus, gpt-6.2-sol", "ok"),
      L("gh signed in", "ok"),
      L("quota unknown, no codexbar", "WARN"),
      L("      fix: nothing needed"),
      L("no factory runs here yet", "ok"),
      L(""),
      L("Factory agents work without asking."),
      L("Each worker runs as you, with full"),
      L("access to this Mac, limited only by"),
      L("its brief and its own worktree. That"),
      L("is not a sandbox. Reviewers are told"),
      L("not to change files. Sheepdog names"),
      L("the model for every agent and does"),
      L("not read or change your Claude, Codex"),
      L("or agy settings. To stop it:"),
      L("  sheepdog factory stop"),
      L(""),
      L("1 of 5  What should it build?", "", true),
      L("One sentence, or a file path."),
      L("> ▌")
    ];
    const failBody = [
      L("no agent CLI is signed in", "FAIL"),
      L("      fix: at your Mac, run  claude"),
      L("      and sign in. codex or agy"),
      L("      work too."),
      L("gh is not signed in", "FAIL"),
      L("      fix: run  gh auth login"),
      L(""),
      L("2 things stop the start."),
      L("Fix it, then press Return to check"),
      L("again. Control-C quits."),
      L("▌")
    ];
    return { c, lines: head.concat(fail ? failBody : okBody) };
  }
}
</script>
</body>
</html>
