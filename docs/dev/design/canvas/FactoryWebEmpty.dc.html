<!doctype html>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0;background:#FAF8F3}
textarea::placeholder{color:#6B6E75}
</style>
</helmet>
<div style="min-height: 100vh; background: #FAF8F3; color: #1F1F22; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.5">
<div style="max-width: 1200px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 32px) 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<img src="/_blob/1899743c7d9a9dc4065fe836d387e378" alt="" style="width: 32px; height: 32px">
<span style="font-family: Outfit, Inter, sans-serif; font-weight: 700; font-size: 20px; line-height: 1">sheepdog</span>
<span style="font-family: Outfit, Inter, sans-serif; font-weight: 500; font-size: 20px; line-height: 1; color: #6B6E75">factory</span>
<span style="display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-size: 13px; color: #6B6E75"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #1D6B46"></span>live · Mac mini</span>
</header>

<section aria-label="Send a request" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; border-radius: 22px; box-shadow: 0 1px 2px rgba(31,31,34,0.12)">
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="ask-empty" style="font-size: 14px; font-weight: 500">tell the factory what you want</label>
<textarea id="ask-empty" rows="2" placeholder="e.g. add a light theme to the web app" style="resize: none; width: 100%; box-sizing: border-box; padding: 11px 14px; background: #FAF8F3; color: #1F1F22; border: 1px solid #E4E0D7; border-radius: 14px; font: inherit"></textarea>
</div>
<div style="display: flex; gap: 8px; flex: 1 0 auto; justify-content: flex-end">
<button type="button" aria-label="Speak your request" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: #1F1F22; border: 1px solid #E4E0D7; border-radius: 999px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
<button type="button" style="height: 44px; padding: 0 22px; background: #D98718; color: #1F1F22; border: none; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer">Send</button>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 24px">tasks</h1>
<section aria-label="No tasks" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 24px; background: #FFFFFF; border: 1px solid #E4E0D7; border-radius: 14px">
<img src="/_blob/586f23741b475e78bce4f4b2ad33d789" alt="The sheepdog asleep with its headset on" style="width: 280px; max-width: 100%; height: auto">
<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 20px">nothing running</h2>
<p style="margin: 0; color: #6B6E75">No tasks on any machine. Tell the factory what you want above, and the coordinator plans the work and starts it.</p>
<p style="margin: 0; font-size: 13px; color: #6B6E75">23 done earlier · <a href="#" style="color: #8A5700">show them</a></p>
</div>
</section>
</main>
<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section aria-label="Open asks" style="display: flex; flex-direction: column; gap: 6px; padding: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; border-radius: 14px">
<h2 style="margin: 0; font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 18px">asks for you</h2>
<p style="margin: 0; font-size: 14px; color: #6B6E75">Nothing waits for you.</p>
</section>
<section aria-label="Agent tree" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #FFFFFF; border: 1px solid #E4E0D7; border-radius: 14px">
<h2 style="margin: 0; font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 18px">agents</h2>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #6A46B0"></span>
<div style="display: flex; flex-direction: column">
<span style="font-weight: 500">Coordinator</span>
<span style="font-size: 12px; color: #6B6E75">claude opus · idle · no workers</span>
</div>
</div>
</section>

</aside>
</div>
</div>
</div>
</x-dc>
