<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — Agents at the largest text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<dc-import name="TopBar" pane="agents" waiting="1" dark="{{ dark }}" hint-size="390px,102px"></dc-import>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 4px 16px 0; border-top: 1px solid {{c.line}}">
<div style="display: flex; flex-wrap: wrap; gap: 0 10px; padding-left: 4px; font-size: 44px; line-height: 52px; font-weight: 600; text-transform: uppercase; color: {{c.accentText}}">Needs you<span style="font-weight: 400; color: {{c.ink2}}">1</span></div>
<article style="position: relative; box-sizing: border-box; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; border-color: {{c.accent}}"><span style="display: flex; align-items: flex-start; gap: 8px"><span style="width: 8px; height: 8px; margin-top: 26px; border-radius: 4px; background: {{c.blocked}}; flex-shrink: 0"></span><span style="font-size: 53px; line-height: 60px; font-weight: 600; overflow-wrap: anywhere">codex-docs</span></span>
<span style="padding-left: 16px; font-size: 43px; line-height: 50px; color: {{c.ink2}}">codex</span>
<span style="padding-left: 16px; font-size: 44px; line-height: 52px; font-weight: 600; color: {{c.accentText}}">Blocked · just now</span>
<span style="padding-left: 16px; font-size: 49px; line-height: 58px; color: {{c.ink2}}">Update the install section of the README</span></article>
</main>
<div style="position: absolute; left: 12px; bottom: 26px; width: 366px; height: 76px; display: flex"><dc-import name="Dock" label="Sheepdog" status="Listening" mode="quiet" ax="{{ true }}" dark="{{ dark }}" style="display: block; width: 366px; height: 76px" hint-size="366px,76px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = {"bg": "#FAF8F3", "surface": "#FFFFFF", "surface2": "#F1EEE7", "track": "#ECE8DF", "ink": "#1F1F22", "ink2": "#6B6E75", "line": "#E4E0D7", "accent": "#D98718", "accentText": "#8A5700", "accentTint": "#FDF1DC", "blocked": "#D99417", "blue": "#1F5F9E", "green": "#1D6B46", "idle": "#5C6370", "red": "#B42318", "side": "#F3F0E8", "selBg": "#E5DFD2", "sel": "#FFFFFF", "shadow": "0 1px 2px rgba(31,31,34,0.12)", "dash": "#CFC9BC", "chevron": "#8E929A", "kw": "#6A46B0", "str": "#1D6B46", "fn": "#1F5F9E", "num": "#8A5700", "add": "#1A8038", "rem": "#BF2924", "addFill": "rgba(52,199,89,0.12)", "remFill": "rgba(255,59,48,0.12)", "addWord": "rgba(52,199,89,0.32)", "remWord": "rgba(255,59,48,0.32)", "scrim": "rgba(31,31,34,0.32)", "wash": "rgba(250,248,243,0.55)", "pop": "0 12px 40px rgba(31,31,34,0.18), 0 0 0 1px #E4E0D7"};
    const dark = {"bg": "#16181C", "surface": "#1F2126", "surface2": "#26292F", "track": "#26292F", "ink": "#F5F2EA", "ink2": "#A3A7AF", "line": "#2E3138", "accent": "#F39C1F", "accentText": "#F5B83D", "accentTint": "#2A2416", "blocked": "#F0A92A", "blue": "#6AA8EB", "green": "#5CC792", "idle": "#9AA1AD", "red": "#F26B5B", "side": "#1B1D22", "selBg": "#2C2F36", "sel": "#3A3D44", "shadow": "0 1px 2px rgba(0,0,0,0.5)", "dash": "#3E4148", "chevron": "#8E929A", "kw": "#B195F0", "str": "#5CC792", "fn": "#6AA8EB", "num": "#F5B83D", "add": "#6BD185", "rem": "#FF7A73", "addFill": "rgba(48,209,88,0.12)", "remFill": "rgba(255,69,58,0.12)", "addWord": "rgba(48,209,88,0.32)", "remWord": "rgba(255,69,58,0.32)", "scrim": "rgba(0,0,0,0.5)", "wash": "rgba(22,24,28,0.55)", "pop": "0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px #2E3138"};
    const d = !!this.props.dark;
    const c = d ? dark : light;
    
    return { c, dark: d,  };
  }
}
</script>
</body>
</html>
