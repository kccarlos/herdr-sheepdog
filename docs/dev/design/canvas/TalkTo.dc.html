      <button aria-current="true" style="border: 0; border-bottom: 1px solid #E4E0D7; background: transparent; color: #1F1F22; text-align: left; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 60px">

    <p style="margin: -6px 4px 0; font-size: 13px; line-height: 18px; color: #6B6E75">Run <span style="font-family: 'SF Mono', ui-monospace, monospace; font-size: 12px">sheepdog pair</span> on the other computer, then scan its code.</p>
