<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — a project board at the largest text size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 4150px; background: {{ bg }}">
  <dc-import name="FactoryProject" ax="{{ true }}" dark="{{ dark }}" style="display: block" hint-size="390px,4150px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 4150}}'>
class Component extends DCLogic {
  renderVals() { const d = this.props.dark ?? false; return { dark: !!d, bg: d ? "#16181C" : "#FAF8F3" }; }
}
</script>
</body>
</html>
