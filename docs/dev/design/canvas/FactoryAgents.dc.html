<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — Agents with a permanent head per factory project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<dc-import name="TopBar" pane="agents" waiting="{{ waiting }}" dark="{{ dark }}" hint-size="390px,102px"></dc-import>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 4px 16px 0; border-top: 1px solid {{c.line}}">
<sc-if value="{{ gone }}" hint-placeholder-val="{{ false }}"><div role="status" style="flex-shrink: 0; margin-top: 6px; padding: 10px 14px; border-radius: 14px; background: {{c.surface}}; border: 1px dashed {{c.dash}}; font-size: 15px; font-weight: 600">This project is gone.</div></sc-if>
<sc-if value="{{ s.needs }}" hint-placeholder-val="{{ true }}">
<dc-import name="AgentSection" label="Needs you" count="1" dark="{{ dark }}" style="display: block; flex-shrink: 0" hint-size="358px,24px"></dc-import>
<sc-if value="{{ s.askCard }}" hint-placeholder-val="{{ true }}">
<dc-import name="FactoryAskCard" kind="{{ s.askKind }}" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,236px"></dc-import>
</sc-if>
<sc-if value="{{ s.blockedHead }}" hint-placeholder-val="{{ false }}">
<dc-import name="FactoryHead" project="notes" blocked="{{ true }}" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,400px"></dc-import>
</sc-if>
</sc-if>
<dc-import name="AgentSection" label="Working" count="{{ s.workingCount }}" dark="{{ dark }}" style="display: block; flex-shrink: 0" hint-size="358px,24px"></dc-import>
<sc-if value="{{ s.notesHead }}" hint-placeholder-val="{{ true }}">
<dc-import name="FactoryHead" project="notes" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,112px"></dc-import>
</sc-if>
<sc-if value="{{ s.tie }}" hint-placeholder-val="{{ false }}">
<dc-import name="FactoryHead" project="notes2" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,112px"></dc-import>
</sc-if>
<sc-if value="{{ s.agentCard }}" hint-placeholder-val="{{ false }}"><dc-import name="AgentCard" agent="codex-payments" open="{{ false }}" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,70px"></dc-import></sc-if>
<sc-if value="{{ s.stopped }}" hint-placeholder-val="{{ true }}">
<dc-import name="AgentSection" label="Stopped" count="1" dark="{{ dark }}" style="display: block; flex-shrink: 0" hint-size="358px,24px"></dc-import>
<dc-import name="FactoryHead" project="photos" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,160px"></dc-import>
</sc-if>
<sc-if value="{{ s.doneOpen }}" hint-placeholder-val="{{ false }}">
<button aria-expanded="true" style="flex-shrink: 0; align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: {{c.ink2}}; padding: 0 4px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg>Done (3)</button>
<dc-import name="FactoryHead" project="recipes" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,112px"></dc-import>
<dc-import name="AgentCard" agent="claude-migration" open="{{ false }}" dark="{{ dark }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,70px"></dc-import>
</sc-if>
<sc-if value="{{ s.doneClosed }}" hint-placeholder-val="{{ true }}">
<button aria-expanded="false" style="flex-shrink: 0; align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: {{c.ink2}}; padding: 0 4px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>Done (3)</button>
</sc-if>
</main>
<div style="position: absolute; left: 12px; bottom: 26px; width: 366px; height: 60px; display: flex"><dc-import name="Dock" label="Sheepdog" status="Listening" mode="quiet" dark="{{ dark }}" style="display: block; width: 366px; height: 60px" hint-size="366px,60px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "state": {"editor": "enum", "options": ["running", "blocked", "doneopen", "readback", "tie", "gone"], "default": "running"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = {"bg": "#FAF8F3", "dash": "#8E8A80", "surface": "#FFFFFF", "ink": "#1F1F22", "ink2": "#6B6E75", "line": "#E4E0D7"};
    const dark = {"bg": "#16181C", "dash": "#6B707A", "surface": "#1F2126", "ink": "#F5F2EA", "ink2": "#A3A7AF", "line": "#2E3138"};
    const d = !!this.props.dark;
    const c = d ? dark : light;
    const st = this.props.state ?? 'running';
    const S = {
      running:  { needs: true,  askCard: true,  askKind: "delete",   blockedHead: false, notesHead: true,  tie: false, workingCount: "2", stopped: true,  doneOpen: false, doneClosed: true },
      blocked:  { needs: true,  askCard: false, askKind: "delete",   blockedHead: true,  notesHead: false, tie: false, workingCount: "1", stopped: false, doneOpen: false, doneClosed: true },
      doneopen: { needs: false, askCard: false, askKind: "delete",   blockedHead: false, notesHead: false, tie: false, workingCount: "1", stopped: true,  doneOpen: true,  doneClosed: false },
      readback: { needs: true,  askCard: true,  askKind: "readback", blockedHead: false, notesHead: true,  tie: false, workingCount: "2", stopped: false, doneOpen: false, doneClosed: true },
      gone:     { needs: false, askCard: false, askKind: "delete",   blockedHead: false, notesHead: false, tie: false, workingCount: "1", stopped: true,  doneOpen: false, doneClosed: true },
      tie:      { needs: false, askCard: false, askKind: "delete",   blockedHead: false, notesHead: true,  tie: true,  workingCount: "3", stopped: false, doneOpen: false, doneClosed: true }
    };
    const s = Object.assign({}, S[st] || S.running); s.agentCard = st !== "running"; if (st === "running") s.workingCount = "1";
    return { c, dark: d, s, gone: st === "gone", waiting: s.needs ? "1" : "0" };
  }
}
</script>
</body>
</html>
