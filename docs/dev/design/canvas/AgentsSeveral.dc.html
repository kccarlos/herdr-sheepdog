<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — Agents, several computers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5700}a:hover{color:#5E3B00}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #FAF8F3; color: #1F1F22; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="TopBar" pane="agents" waiting="2" hint-size="390px,102px"></dc-import>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 6px 16px 0; border-top: 1px solid #E4E0D7">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 0 0 2px; flex-shrink: 0">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      <h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 16px; font-weight: 600">Work Mac</h2>
      <span style="font-size: 12px; font-weight: 600; color: #6B6E75">Voice is here</span>
      <span style="flex-grow: 1"></span>
      <button role="radio" aria-checked="true" aria-label="The voice is on Work Mac" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: #1F1F22; color: #FAF8F3; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"></path></svg></span></button>
    </div>
    <dc-import name="AgentSection" label="Needs you" count="1" style="display: block; flex-shrink: 0" hint-size="358px,24px"></dc-import>
    <dc-import name="AgentCard" agent="auth-fix" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,260px"></dc-import>
    <dc-import name="AgentSection" label="Working" count="2" style="display: block; flex-shrink: 0" hint-size="358px,24px"></dc-import>
    <dc-import name="AgentCard" agent="payments" open="{{ false }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,70px"></dc-import>
    <dc-import name="AgentCard" agent="api-docs" open="{{ false }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,70px"></dc-import>

    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0 0 2px; flex-shrink: 0">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F22" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      <h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 16px; font-weight: 600">Home Mac</h2>
      <span style="flex-grow: 1"></span>
      <button role="radio" aria-checked="false" aria-label="Move the voice to Home Mac" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #8E8A80; color: #6B6E75; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"></path></svg></span></button>
    </div>
    <dc-import name="AgentCard" agent="blog" primary="{{ false }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,200px"></dc-import>
    <dc-import name="AgentCard" agent="photos" open="{{ false }}" w="{{ 358 }}" style="display: block; width: 358px; flex-shrink: 0" hint-size="358px,70px"></dc-import>

    <div style="flex-shrink: 0; border-radius: 14px; border: 1.5px dashed #CFC9BC; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Can't reach Studio mini</span>
        <span style="font-size: 13px; color: #6B6E75">Last seen 9:12. Is it awake and on Tailscale?</span>
      </div>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4E0D7; background: #FFFFFF; color: #1F1F22; font-size: 14px; font-weight: 600">Retry</button>
    </div>
  </main>

  <div style="position: absolute; left: 12px; bottom: 26px; width: 366px; height: 60px; display: flex">
    <dc-import name="Dock" label="Work Mac" status="Listening" mode="quiet" style="display: block; width: 366px; height: 60px" hint-size="366px,60px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
