<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheepdog — project actions: told, stop, new goal, resume, reopen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2270px; height: 964px; box-sizing: border-box; padding: 40px; display: flex; gap: 60px; background: {{ bg }}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">After Send: told</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="told" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Stop asks first</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="stopconfirm" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">New goal</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="newgoal" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Stopped: Resume, held words</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="stopped" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
    <h2 style="margin: 0; height: 28px; font-family: ui-rounded, 'SF Pro Rounded', Outfit, sans-serif; font-size: 20px; font-weight: 700; color: {{ ink }}; white-space: nowrap">Finished: reopen, same goal</h2>
    <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px {{ line }}"><dc-import name="FactoryProject" state="reopen" dark="{{ dark }}" style="display: block" hint-size="390px,844px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 2270, "height": 964}}'>
class Component extends DCLogic {
  renderVals() { const d = !!(this.props.dark ?? false); return { dark: d, bg: d ? "#0E0F12" : "#F3F0E8", ink: d ? "#F5F2EA" : "#1F1F22", line: d ? "#2E3138" : "#E4E0D7" }; }
}
</script>
</body>
</html>
